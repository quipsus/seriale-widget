<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Seriale — widget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    color-scheme: light;
    --s-bg: #F4F7F8;
    --s-bg-alt: #E8EEF2;
    --s-ink: #154565;
    --s-ink-soft: #526A7A;
    --s-sea: #4FA3DA;
    --s-mint: #5EBAA3;
    --s-mint-bg: #E7F3F0;
    --s-mint-ink: #2E6E5D;
    --s-warn: #CB704D;
    --s-line: #BFCFD9;
    --s-violet: #8C7CC0;
  }

*{ box-sizing: border-box; }

html{ background: #F4F7F8; color-scheme: light; }

body{
margin:0;
background: #F4F7F8;
color: #154565;
font-family: Calibri, ‘Segoe UI’, Helvetica, Arial, sans-serif;
line-height: 1.5;
font-weight: 400;
font-size: 14px;
}

.wrap{ padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }

.toolbar{
display:flex; justify-content: space-between; align-items: center;
margin-bottom: 12px; flex-wrap: wrap; gap: 12px;
}
.toolbar input[type=text]{
font-family: inherit;
font-size: 0.95rem;
padding: 9px 12px;
border: none; border-bottom: 2px solid #154565;
background: transparent; width: 260px; color: #154565;
}
.toolbar input[type=text]:focus{ outline:none; border-bottom-color: #4FA3DA; }
.count{ font-size: 0.8rem; color: #526A7A; }

.pager{
display:flex; justify-content:center; align-items:center; gap: 12px;
margin: 8px 0 12px;
}
.pager button{
font-family: inherit; font-weight: 600; font-size: 0.85rem;
border: 2px solid #154565; background: #F4F7F8; color: #154565;
padding: 8px 16px; cursor: pointer; border-radius: 8px;
}
.pager button:hover:not(:disabled){ background: #154565; color: #F4F7F8; }
.pager button:disabled{ opacity: 0.35; cursor: default; }
.pager .info{ font-size: 0.85rem; color: #526A7A; min-width: 110px; text-align:center; }

.cards{ display:flex; flex-direction:column; gap: 8px; }

.card{
display: grid;
grid-template-columns: 76px 1fr 200px;
gap: 20px;
padding: 16px;
align-items: start;
position: relative;
color: #154565;
}
.card:not(:first-child)::before{
content:””;
position: absolute;
top: -4px; left: 16px; right: 16px;
height: 1px;
background: #BFCFD9;
}
.card:hover{ background: #E8EEF2; border-radius: 10px; }
.card:hover::before, .card:hover + .card::before{ display:none; }

.poster{
width: 76px; height: 106px;
background-color: #154565;
background-image: linear-gradient(150deg, #4FA3DA, #154565);
display:flex; align-items:center; justify-content:center;
color: #F4F7F8; font-weight: 800; font-size: 1.5rem;
flex-shrink:0;
}

.card-main h3{ font-weight: 700; font-size: 1.05rem; margin: 0 0 4px; color: #154565; }
.meta{ font-size: 0.8rem; color: #526A7A; margin-bottom: 8px; }
.desc{ font-size: 0.87rem; color: #526A7A; max-width: 58ch; margin: 0; }

.card-side{ text-align: right; display:flex; flex-direction:column; align-items:flex-end; gap: 8px; }

.tag{
font-size: 0.72rem; font-weight: 600;
padding: 6px 9px;
border: 1px solid #154565;
border-radius: 8px;
width: 100%;
text-align: center;
box-sizing: border-box;
cursor: pointer;
background: none;
font-family: inherit;
}
.tag.oczekiwany{ border-color: #8C7CC0; color: #564785; background: #EDEAF5; }
.tag.emitowany{ border-color: #5EBAA3; color: #2E6E5D; background: #E7F3F0; }
.tag.kompletny{ border-color: #4FA3DA; color: #2C7DB3; background: #E5EFF5; }
.tag.niekompletny{ border-color: #CB704D; color: #B25A38; background: #FBEEE8; }
.tag:hover{ filter: brightness(0.95); }
.tag-hint{ font-size: 0.62rem; color: #526A7A; margin-top: -4px; }

.location-btn{
font-weight: 600; font-size: 0.72rem;
border: 1px solid #154565; border-radius: 8px;
padding: 6px 9px; width: 100%; box-sizing: border-box;
text-align: center;
color: #154565; background: #F4F7F8;
}

.empty{ text-align:center; color: #526A7A; padding: 40px 0; font-size: 0.9rem; }
.error{ background: #FBEEE8; border: 1px solid #CB704D; color: #B25A38; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; }
</style>

</head>
<body>

<div class="wrap">
  <div class="toolbar">
    <input type="text" id="szukaj" placeholder="szukaj tytułu…">
    <div class="count" id="licznik"></div>
  </div>
  <div class="pager" id="pager-gora"></div>
  <div id="blad"></div>
  <div class="cards" id="lista"></div>
  <div class="empty" id="pusto" style="display:none;">Brak seriali pasujących do wyszukiwania.</div>
  <div class="pager" id="pager-dol"></div>
</div>

<script>
  // ---- Konfiguracja ----
  // Widok "seriale" = w trakcie / czekające.
  const STATUSY_W_WIDOKU = ['oczekiwany', 'emitowany'];
  // Klik w tag przełącza tylko w obrębie tego widoku (żeby nie "zgubić" serialu).
  const KOLEJNOSC_STATUSOW = ['oczekiwany', 'emitowany'];

  const NA_STRONE = 25;
  let wszystkieRekordy = [];
  let strona = 1;

  function pokazBlad(tresc){
    document.getElementById('blad').innerHTML = '<div class="error">' + escapeHtml(tresc) + '</div>';
  }

  function inicjalTytulu(tytul){
    return (tytul || '?').trim().charAt(0).toUpperCase();
  }

  function escapeHtml(tekst){
    const div = document.createElement('div');
    div.textContent = tekst == null ? '' : String(tekst);
    return div.innerHTML;
  }

  function renderujPager(liczbaStron){
    const html = liczbaStron <= 1 ? '' :
      '<button data-akcja="wstecz"' + (strona <= 1 ? ' disabled' : '') + '>‹ poprzednia</button>' +
      '<span class="info">strona ' + strona + ' z ' + liczbaStron + '</span>' +
      '<button data-akcja="dalej"' + (strona >= liczbaStron ? ' disabled' : '') + '>następna ›</button>';
    document.getElementById('pager-gora').innerHTML = html;
    document.getElementById('pager-dol').innerHTML = html;
  }

  function renderuj(){
    const fraza = document.getElementById('szukaj').value.trim().toLowerCase();
    const lista = document.getElementById('lista');
    const pusto = document.getElementById('pusto');
    lista.innerHTML = '';

    const pasujace = wszystkieRekordy
      .filter(r => STATUSY_W_WIDOKU.includes(r.status))
      .filter(r => !fraza || (r.tytul || '').toLowerCase().includes(fraza))
      .sort((a, b) => (a.tytul || '').localeCompare(b.tytul || '', 'pl'));

    const liczbaStron = Math.max(1, Math.ceil(pasujace.length / NA_STRONE));
    if(strona > liczbaStron) strona = liczbaStron;
    if(strona < 1) strona = 1;

    const start = (strona - 1) * NA_STRONE;
    const naStronie = pasujace.slice(start, start + NA_STRONE);

    document.getElementById('licznik').textContent = pasujace.length === 0
      ? '0 pozycji'
      : (start + 1) + '–' + (start + naStronie.length) + ' z ' + pasujace.length;

    renderujPager(liczbaStron);

    if(pasujace.length === 0){
      pusto.style.display = 'block';
      return;
    }
    pusto.style.display = 'none';

    naStronie.forEach(r => {
      const karta = document.createElement('div');
      karta.className = 'card';

      const metaCzesci = [r.rok, r.kraj].filter(Boolean);
      const historiaHtml = '';

      karta.innerHTML =
        '<div class="poster">' + escapeHtml(inicjalTytulu(r.tytul)) + '</div>' +
        '<div class="card-main">' +
          '<h3>' + escapeHtml(r.tytul || '(bez tytułu)') + '</h3>' +
          '<div class="meta">' + escapeHtml(metaCzesci.join(' · ')) + '</div>' +
          '<p class="desc">' + escapeHtml(r.opis || '') + '</p>' +
          historiaHtml +
        '</div>' +
        '<div class="card-side">' +
          '<button class="tag ' + escapeHtml(r.status || '') + '" data-id="' + r.id + '">' + escapeHtml(r.status || '—') + '</button>' +
          '<div class="tag-hint">kliknij, by zmienić</div>' +
          ((r.dysk || r.rozmiar_gb)
            ? '<div class="location-btn">' + escapeHtml(r.dysk || '—') + (r.rozmiar_gb ? ' · ' + Number(r.rozmiar_gb).toFixed(1) + ' GB' : '') + '</div>'
            : '') +
        '</div>';
      lista.appendChild(karta);
    });
  }

  async function onKlikStatus(btn){
    const id = Number(btn.dataset.id);
    const rekord = wszystkieRekordy.find(r => r.id === id);
    if(!rekord) return;

    const obecnyIndeks = KOLEJNOSC_STATUSOW.indexOf(rekord.status);
    const nowyStatus = KOLEJNOSC_STATUSOW[(obecnyIndeks + 1) % KOLEJNOSC_STATUSOW.length];

    btn.disabled = true;
    try{
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Seriale', id, { status: nowyStatus }]
      ]);
      rekord.status = nowyStatus;
      renderuj();
    } catch(e){
      pokazBlad('Nie udało się zapisać zmiany statusu: ' + e.message);
      btn.disabled = false;
    }
  }

  async function wczytajDane(){
    try{
      const tabela = await grist.docApi.fetchTable('Seriale');
      const liczbaWierszy = tabela.id.length;
      wszystkieRekordy = [];
      for(let i = 0; i < liczbaWierszy; i++){
        wszystkieRekordy.push({
          id: tabela.id[i],
          tytul: tabela.tytul ? tabela.tytul[i] : '',
          rok: tabela.rok ? tabela.rok[i] : '',
          kraj: tabela.kraj ? tabela.kraj[i] : '',
          status: tabela.status ? tabela.status[i] : '',
          dysk: tabela.dysk ? tabela.dysk[i] : '',
          rozmiar_gb: tabela.rozmiar_gb ? tabela.rozmiar_gb[i] : 0,
          opis: tabela.opis ? tabela.opis[i] : '',
        });
      }
      renderuj();
    } catch(e){
      pokazBlad('Nie udało się wczytać danych z Grista: ' + e.message);
    }
  }

  // Jedna obsługa kliknięć dla całej strony (zamiast osobnych na każdej karcie).
  document.addEventListener('click', (ev) => {
    const tag = ev.target.closest('.tag[data-id]');
    if(tag){ onKlikStatus(tag); return; }
    const pagerBtn = ev.target.closest('.pager button[data-akcja]');
    if(pagerBtn && !pagerBtn.disabled){
      strona += (pagerBtn.dataset.akcja === 'dalej') ? 1 : -1;
      renderuj();
      window.scrollTo(0, 0);
    }
  });

  document.getElementById('szukaj').addEventListener('input', () => {
    strona = 1;
    renderuj();
  });

  grist.ready({ requiredAccess: 'full' });
  grist.onRecords(wczytajDane);
  wczytajDane();
</script>

</body>
</html>
