<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Seriale — widget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{ color-scheme: light; }
  *{ box-sizing: border-box; }
  html{ background: #F4F7F8; color-scheme: light; }

  body{
    margin:0;
    background: #F4F7F8;
    color: #154565;
    font-family: 'Inter', Calibri, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.5;
    font-weight: 400;
    font-size: 14px;
  }

  /* ---------- nagłówek: tytuł, dyski, zakładki ---------- */
  header{
    padding: 16px 20px 14px;
    border-bottom: 2px solid #154565;
    display:flex; flex-direction:column; gap: 10px;
  }
  .header-row{
    display:flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px 24px;
  }
  h1{
    font-weight: 800; font-size: 1.9rem; margin: 0;
    letter-spacing: -0.5px; color: #154565; line-height: 1.15;
  }
  nav{ display:flex; gap: 4px; flex-wrap: wrap; }
  nav a{
    font-weight: 600; font-size: 0.88rem;
    border: 2px solid #154565; color: #154565; background: none;
    padding: 8px 16px; cursor: pointer; border-radius: 8px;
    text-decoration: none; display:inline-block;
  }
  nav a.active{ background: #154565; color: #F4F7F8; }
  nav a:not(.active):hover{ background: #E8EEF2; }

  .disk-strip-bar{ display:flex; gap: 22px; flex-wrap: wrap; align-items:flex-start; }
  .disk-gauge{
    display:flex; flex-direction:column; gap: 4px;
    cursor: pointer; position: relative; min-width: 120px;
  }
  .disk-gauge-label{
    font-size: 0.72rem; font-weight: 700; color: #154565;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .disk-gauge-label span{ font-weight:500; color: #526A7A; font-size:0.68rem; }
  .filmstrip{
    display:flex; align-items:stretch;
    background: transparent; border: solid #154565; border-width: 7px 4px; border-radius: 4px; position: relative;
  }
  .filmstrip::before, .filmstrip::after{
    content:""; position:absolute; left:2px; right:2px; height:3px;
    background-image: radial-gradient(circle, #E8EEF2 1.2px, transparent 1.4px);
    background-size: 8px 3px; background-repeat: repeat-x;
  }
  .filmstrip::before{ top: -5px; }
  .filmstrip::after{ bottom: -5px; }
  .filmstrip-frame{ flex: 1; height: 14px; background: transparent; border-left: 3px solid #154565; }
  .filmstrip-frame:first-child{ border-left: none; }
  .filmstrip-frame.filled.dysk0{ background: #5EBAA3; }
  .filmstrip-frame.filled.dysk1{ background: #4FA3DA; }
  .filmstrip-frame.filled.dysk2{ background: #8C7CC0; }
  .disk-gauge-detail{
    display:none; position:absolute; top: calc(100% + 8px); left: 0;
    background: #154565; color: #F4F7F8;
    font-size: 0.74rem; white-space: nowrap; padding: 6px 10px; border-radius: 6px; z-index: 5;
  }
  .disk-gauge-detail::after{
    content:""; position:absolute; bottom:100%; left: 18px;
    border: 5px solid transparent; border-bottom-color: #154565;
  }
  .disk-gauge.open .disk-gauge-detail{ display:block; }

  /* ---------- lista ---------- */
  .wrap{ padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }

  .toolbar{
    display:flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 12px;
  }
  .toolbar input[type=text]{
    font-family: inherit; font-size: 0.95rem; padding: 9px 12px;
    border: none; border-bottom: 2px solid #154565; border-radius: 8px 8px 0 0;
    background: transparent; width: 260px; color: #154565;
  }
  .toolbar input[type=text]:focus{ outline:none; border-bottom-color: #4FA3DA; }
  .count{ font-size: 0.8rem; color: #526A7A; }

  .filtry{ display:flex; justify-content: space-between; align-items:center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtry-dol{ margin: 16px 0 0; justify-content: flex-end; }
  .chips{ display:flex; gap: 6px; flex-wrap: wrap; }
  .chip{
    font-family: inherit; font-weight: 600; font-size: 0.82rem;
    background: none; border: 2px solid #4FA3DA; color: #2C7DB3;
    padding: 7px 14px; cursor: pointer; border-radius: 8px;
  }
  .chip.active{ background: #4FA3DA; color: #F4F7F8; }
  .chip:not(.active):hover{ background: #E8EEF2; }

  .pager{ display:flex; align-items:center; gap: 8px; margin-left: auto; }
  .pager button{
    font-family: inherit; font-weight: 700; font-size: 1.3rem; line-height: 1;
    border: 2px solid #154565; background: #F4F7F8; color: #154565;
    width: 40px; height: 36px; padding: 0 0 3px; cursor: pointer; border-radius: 8px;
  }
  .pager button:hover:not(:disabled){ background: #154565; color: #F4F7F8; }
  .pager button:disabled{ opacity: 0.35; cursor: default; }
  .pager .info{ font-size: 0.85rem; color: #526A7A; min-width: 56px; text-align:center; }

  .cards{ display:flex; flex-direction:column; gap: 8px; }

  .card{
    display: grid; grid-template-columns: 76px 1fr 200px; gap: 20px;
    padding: 16px; align-items: start; position: relative; color: #154565;
  }
  .card:not(:first-child)::before{
    content:""; position: absolute; top: -4px; left: 16px; right: 16px;
    height: 1px; background: #BFCFD9;
  }
  .card:hover{ background: #E8EEF2; border-radius: 10px; }
  .card:hover::before, .card:hover + .card::before{ display:none; }

  .poster{
    width: 76px; height: 106px; border-radius: 8px;
    background-color: #154565;
    background-image: linear-gradient(150deg, #4FA3DA, #154565);
    display:flex; align-items:center; justify-content:center;
    color: #F4F7F8; font-weight: 800; font-size: 1.5rem; flex-shrink:0;
    position: relative; overflow: hidden;
  }
  .poster img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; }

  .card-main h3{ font-weight: 700; font-size: 1.05rem; margin: 0 0 4px; color: #154565; }
  .meta{ font-size: 0.8rem; color: #526A7A; margin-bottom: 8px; }
  .desc{
    font-size: 0.87rem; color: #526A7A; max-width: 72ch; margin: 0; cursor: pointer;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
  }
  .desc.rozwiniete{ display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
  .card-main{ min-height: 118px; min-width: 0; }
  .kolejny{ font-size: 0.82rem; color: #154565; margin: 0 0 8px; }
  .kolejny .zaleglosc{ background: #FBEEE8; color: #B25A38; border-radius: 8px; padding: 1px 8px; font-weight: 600; margin-left: 6px; white-space: nowrap; }

  .card-dol{ grid-column: 1 / -1; }
  .card-main h3 a{ color: inherit; text-decoration: none; }
  .card-main h3 a:hover{ text-decoration: underline; }
  .komunikat{ display:none; background:#E7F3F0; border:1px solid #5EBAA3; color:#2E6E5D; padding:10px 14px; margin-bottom:12px; font-size:0.85rem; border-radius:8px; }
  .nastepny{
    font-weight: 800; font-size: 0.82rem; color: #CB704D; border: 2px solid #CB704D;
    border-radius: 8px; padding: 5px 9px; width: 100%; text-align: center; background: none;
  }
  .nastepny.dostepny{ background: #CB704D; color: #FFFFFF; }
  .season-row{ display:grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap:5px; margin:4px 0; }
  .season-chip{
    font-family: inherit; font-size: 0.74rem; font-weight: 600; border: 1px solid #BFCFD9; padding: 5px 4px;
    cursor: pointer; color: #526A7A; text-align: center; border-radius: 8px; background: none;
  }
  .season-chip.done{ border-color: #5EBAA3; color: #2E6E5D; background: #E7F3F0; }
  .season-chip.partial{ border-color: #4FA3DA; color: #2C7DB3; background: #E5EFF5; }
  .season-chip.selected{ outline: 2px solid #154565; outline-offset: 1px; }
  .ep-progress{ font-size: 0.76rem; color: #526A7A; margin: 8px 0 4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ep-progress .zaleglosc{ background: #FBEEE8; color: #B25A38; border-radius: 8px; padding: 1px 8px; font-weight: 700; margin-left: 8px; }
  .mini-btn{ font-family: inherit; font-size: 0.72rem; font-weight: 600; background: none; border: 1px solid #154565; color: #154565; padding: 4px 10px; cursor: pointer; border-radius: 8px; }
  .mini-btn:hover{ background: #154565; color: #F4F7F8; }
  .ep-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 8px 0 4px; }
  .ep-pixel{
    font-family: inherit; height: 28px; background: #FFFFFF; border: 1px solid #BFCFD9; cursor: pointer;
    display:flex; align-items:center; justify-content:center; font-size: 0.68rem; font-weight: 600;
    color: #526A7A; border-radius: 8px; padding: 0;
  }
  .ep-pixel.done{ background: #5EBAA3; border-color: #5EBAA3; color: #2E6E5D; }
  .ep-pixel.do-nagrania{ border: 2px solid #CB704D; color: #B25A38; font-weight: 800; }
  .ep-pixel.kolejny-odc{ background: #FBEEE8; }
  .ep-pixel.luka{ background: #CB704D; border-color: #CB704D; color: #FFFFFF; }
  .ep-pixel.przyszly{ background: #E8EEF2; border-style: dashed; color: #8AA0AE; cursor: default; }
  .ep-pixel.brak-daty{ background: #E8EEF2; }

  .toolbar-prawa{ display:flex; align-items:center; gap: 12px; }
  .plus-btn{
    font-family: inherit; font-weight: 700; font-size: 1.4rem; line-height: 1;
    border: 2px solid #154565; background: #F4F7F8; color: #154565;
    width: 40px; height: 36px; padding: 0 0 3px; cursor: pointer; border-radius: 8px;
  }
  .plus-btn:hover{ background: #154565; color: #F4F7F8; }
  .dodaj-panel{
    background: #E8EEF2; border: 1px solid #BFCFD9; border-radius: 10px; padding: 14px;
    margin-bottom: 12px; grid-template-columns: 2fr 1fr 1fr; gap: 10px;
  }
  .dodaj-panel input{
    font-family: inherit; font-size: 0.9rem; padding: 9px 10px; border: 1px solid #BFCFD9;
    border-radius: 8px; background: #FFFFFF; color: #154565; min-width: 0;
  }
  .dodaj-panel input:focus{ outline: none; border-color: #4FA3DA; }
  .dodaj-panel .szeroki{ grid-column: 1 / -1; }
  .dodaj-przyciski{ display: flex; gap: 8px; }
  .dodaj-zapisz{ font-family: inherit; font-weight: 700; font-size: 0.85rem; background: #4FA3DA; color: #F4F7F8; border: none; padding: 9px 18px; cursor: pointer; border-radius: 8px; }
  .dodaj-zapisz:hover{ background: #154565; }
  .dodaj-anuluj{ font-family: inherit; font-weight: 700; font-size: 0.85rem; background: none; color: #526A7A; border: 1px solid #BFCFD9; padding: 9px 18px; cursor: pointer; border-radius: 8px; }
  .dodaj-anuluj:hover{ border-color: #154565; color: #154565; }

  .link-btn{
    font-family: inherit; font-weight: 600; font-size: 0.78rem; border: 1px solid #BFCFD9; color: #526A7A;
    padding: 8px 12px; border-radius: 8px; text-decoration: none; background: none; white-space: nowrap;
  }
  .link-btn:hover{ border-color: #154565; color: #154565; }
  .kropka{ color: #CB704D; }
  nav a.active .kropka{ color: #F4B393; }
  .location-btn{ position: relative; display: block; cursor: pointer; }
  .location-btn.brak{ color: #526A7A; border-style: dashed; }
  .usun-btn{
    font-family: inherit; font-size: 0.68rem; background: none; border: none;
    color: #8AA0AE; cursor: pointer; padding: 2px 4px; margin-top: 2px;
  }
  .usun-btn:hover{ color: #CB704D; text-decoration: underline; }
  .usun-btn.confirm{ color: #CB704D; font-weight: 700; }
  .dysk-wybor{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  .obejrzane-row{ display:flex; align-items:center; gap: 6px; flex-wrap: wrap; margin: 10px 0 2px; }
  .obej-etykieta{ font-size: 0.74rem; font-weight: 700; color: #154565; margin-right: 4px; }
  .season-chip.obejrzany{ background: #154565; border-color: #154565; color: #F4F7F8; }
  .obejrzane-row .season-chip{ min-width: 48px; padding: 5px 8px; }
  .obejrzany-tag{
    font-weight: 700; font-size: 0.72rem; padding: 6px 9px; border: 1px solid #154565; border-radius: 8px;
    width: 100%; text-align: center; color: #F4F7F8; background: #154565;
  }
  .chips-sep{ width: 10px; }
  .chip.chip-ob{ border-color: #154565; color: #154565; }
  .chip.chip-ob.active{ background: #154565; color: #F4F7F8; }
  .zrodlo{ text-align: center; font-size: 0.7rem; color: #526A7A; margin-top: 24px; }
  .zrodlo a{ color: inherit; }

  .card-side{ text-align: right; display:flex; flex-direction:column; align-items:flex-end; gap: 8px; }

  .tag{
    font-size: 0.72rem; font-weight: 600; padding: 6px 9px;
    border: 1px solid #154565; border-radius: 8px; width: 100%;
    text-align: center; box-sizing: border-box; cursor: pointer;
    background: none; font-family: inherit;
  }
  .tag.oczekiwany{ border-color: #8C7CC0; color: #564785; background: #EDEAF5; }
  .tag.emitowany{ border-color: #5EBAA3; color: #2E6E5D; background: #E7F3F0; }
  .tag.kompletny{ border-color: #4FA3DA; color: #2C7DB3; background: #E5EFF5; }
  .tag.niekompletny{ border-color: #CB704D; color: #B25A38; background: #FBEEE8; }
  .tag:hover{ filter: brightness(0.95); }
  label.tag{ position: relative; display: block; }
  .status-wybor{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  .kartofel{
    font-size: 1.15rem; line-height: 1; padding: 5px 9px; border: 1px dashed #9AAAB5; border-radius: 8px;
    background: none; cursor: pointer; filter: grayscale(1); opacity: 0.55; width: 100%; box-sizing: border-box;
    font-family: inherit; color: #526A7A;
  }
  .ikona-do{ width: 1.5em; height: 1.5em; vertical-align: middle; }
  .kartofel .ikona-do{ width: 26px; height: 26px; vertical-align: middle; }
  .kartofel span{ font-size: 0.72rem; font-weight: 600; margin-left: 4px; vertical-align: middle; }
  .kartofel.on{ filter: none; opacity: 1; border: 1px solid #B8863B; background: #FBF1DC; color: #8A5F1C; }
  .chip.chip-kart{ border-color: #B8863B; color: #8A5F1C; }
  .chip.chip-kart.active{ background: #B8863B; color: #FFFFFF; }

  .location-btn{
    font-weight: 600; font-size: 0.72rem; border: 1px solid #154565; border-radius: 8px;
    padding: 6px 9px; width: 100%; box-sizing: border-box; text-align: center;
    color: #154565; background: #F4F7F8;
  }

  .empty{ text-align:center; color: #526A7A; padding: 40px 0; font-size: 0.9rem; }
  .error{ background: #FBEEE8; border: 1px solid #CB704D; color: #B25A38; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; }

  details summary{ cursor:pointer; font-size: 0.8rem; color: #2C7DB3; margin-top: 8px; font-weight: 600; }
  .history-block{
    font-size: 0.85rem; background: #E8EEF2; border: 1px solid #BFCFD9; color: #154565;
    padding: 12px 16px; margin-top: 8px; white-space: pre-line; line-height: 1.9; border-radius: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>seriale</h1>
    <div class="disk-strip-bar" id="dyski"></div>
  </div>
  <nav id="nav"></nav>
</header>

<div class="wrap">
  <div class="toolbar">
    <input type="text" id="szukaj" placeholder="szukaj tytułu…">
    <div class="toolbar-prawa"><a class="link-btn" href="https://github.com/quipsus/seriale-skrypty/actions/workflows/odcinki.yml" target="_blank" rel="noopener" title="Otwiera GitHub Actions - tam kliknij Run workflow">sprawdź teraz</a><div class="count" id="licznik"></div><button class="plus-btn" id="plus" title="dodaj ręcznie" aria-label="dodaj ręcznie">+</button></div>
  </div>
  <div class="komunikat" id="komunikat"></div>
  <div class="dodaj-panel" id="dodaj-panel" style="display:none;">
    <input type="text" id="dodaj-tytul" placeholder="tytuł (np. The Wire)">
    <input type="text" id="dodaj-rok" placeholder="rok" inputmode="numeric" maxlength="4">
    <input type="text" id="dodaj-kraj" placeholder="kraj (np. US)" maxlength="6">
    <input type="text" id="dodaj-link" class="szeroki" placeholder="link do epguides (opcjonalnie)">
    <div class="dodaj-przyciski szeroki">
      <button class="dodaj-zapisz" id="dodaj-zapisz">dodaj</button>
      <button class="dodaj-anuluj" id="dodaj-anuluj">anuluj</button>
    </div>
  </div>
  <div class="filtry" id="filtry">
    <div class="chips" id="chips"></div>
    <div class="pager" id="pager-gora"></div>
  </div>
  <div id="blad"></div>
  <div class="cards" id="lista"></div>
  <div class="empty" id="pusto" style="display:none;">brak seriali pasujących do wyszukiwania</div>
  <div class="filtry filtry-dol"><div class="pager" id="pager-dol"></div></div>
  <div class="zrodlo">dane: <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a></div>
</div>

<script>
  // ---- Konfiguracja ----
  // Widok "seriale" = w trakcie / czekające.
  const STATUSY_W_WIDOKU = ['oczekiwany', 'emitowany'];
  // Klik w tag przełącza tylko w obrębie tego widoku (żeby nie "zgubić" serialu).

  function escapeHtml(tekst){
    const div = document.createElement('div');
    div.textContent = tekst == null ? '' : String(tekst);
    return div.innerHTML;
  }

  function pokazBlad(tresc){
    document.getElementById('blad').innerHTML = '<div class="error">' + escapeHtml(tresc) + '</div>';
  }

  function inicjalTytulu(tytul){
    return (tytul || '?').trim().charAt(0).toUpperCase();
  }

  // ---- Plakaty: ładowane wprost z serwerów TMDb (ścieżka zapisana w kolumnie plakat_tmdb).
  // Nie zużywa to limitu wywołań API Grista.
  function plakatHtml(r){
    const litera = escapeHtml(inicjalTytulu(r.tytul));
    const adresTv = (r.plakat_url || '').trim();
    const sciezka = (r.plakat_tmdb || '').trim();
    let adres = '';
    if(/^https:\/\/static\.tvmaze\.com\/uploads\/images\/[A-Za-z0-9_\-\/.]+$/.test(adresTv)) adres = adresTv;
    else if(/^\/[A-Za-z0-9_\-.]+$/.test(sciezka)) adres = 'https://image.tmdb.org/t/p/w185' + sciezka;
    if(adres){
      return '<div class="poster"><span>' + litera + '</span><img src="' + adres +
             '" alt="" loading="lazy" onerror="this.remove()"></div>';
    }
    return '<div class="poster"><span>' + litera + '</span></div>';
  }

  // Liczba różnych sezonów w zapisie historii ("[✓] S01: 24 odc." itd.).
  function liczbaSezonow(historia){
    if(!historia) return 0;
    const numery = new Set();
    const re = /S(\d{1,3})(?:\s*\(\d{4}\))?:/g;
    let m;
    while((m = re.exec(historia)) !== null) numery.add(Number(m[1]));
    return numery.size;
  }

  function odmianaSezonow(n){
    if(n === 1) return '1 sezon';
    const d = n % 10, dd = n % 100;
    if(d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) return n + ' sezony';
    return n + ' sezonów';
  }

  // ---- Ręczne dodawanie ("+"): krótki formularz nad listą ----
  function doFormatuBazy(tytul){
    // "The Wire" -> "Wire, The"; rok w nawiasie na końcu wycinamy do osobnego pola
    let t = (tytul || '').trim();
    let rok = null;
    const m = /^(.*?)\s*\((\d{4})\)\s*$/.exec(t);
    if(m && m[1].trim()){ t = m[1].trim(); rok = Number(m[2]); }
    const a = /^(The|A|An)\s+(.+)$/i.exec(t);
    if(a){
      const art = a[1].charAt(0).toUpperCase() + a[1].slice(1).toLowerCase();
      t = a[2].trim() + ', ' + art;
    }
    return { tytul: t, rokZNazwy: rok };
  }

  function przelaczPanel(pokaz){
    const p = document.getElementById('dodaj-panel');
    if(!p) return;
    p.style.display = pokaz ? 'grid' : 'none';
    if(pokaz){
      const b = document.getElementById('blad');
      if(b) b.innerHTML = '';
      document.getElementById('dodaj-tytul').focus();
    }
  }

  function odczytajFormularz(){
    const wartosc = id => (document.getElementById(id).value || '').trim();
    const rokTxt = wartosc('dodaj-rok');
    const link = wartosc('dodaj-link');
    return {
      tytul: wartosc('dodaj-tytul'),
      rok: /^\d{4}$/.test(rokTxt) ? Number(rokTxt) : null,
      kraj: wartosc('dodaj-kraj').toUpperCase(),
      link: /^https?:\/\//i.test(link) ? link : '',
    };
  }

  function wyczyscFormularz(){
    ['dodaj-tytul', 'dodaj-rok', 'dodaj-kraj', 'dodaj-link'].forEach(id => { document.getElementById(id).value = ''; });
  }

  function podepnijPanelDodawania(dodaj){
    const plus = document.getElementById('plus');
    if(!plus) return;
    plus.addEventListener('click', () => {
      przelaczPanel(document.getElementById('dodaj-panel').style.display === 'none');
    });
    document.getElementById('dodaj-anuluj').addEventListener('click', () => przelaczPanel(false));
    const wyslij = async () => {
      const d = odczytajFormularz();
      if(!d.tytul){ pokazBlad('wpisz tytuł'); return; }
      await dodaj(d);
    };
    document.getElementById('dodaj-zapisz').addEventListener('click', wyslij);
    document.getElementById('dodaj-panel').addEventListener('keydown', ev => {
      if(ev.key === 'Enter'){ ev.preventDefault(); wyslij(); }
    });
  }

  // Długie opisy są przycięte do kilku linii; dotknięcie opisu rozwija go (i zwija z powrotem).
  document.addEventListener('click', (ev) => {
    const opis = ev.target.closest('.desc');
    if(opis) opis.classList.toggle('rozwiniete');
  });

  // Tytuł jako link do strony serialu na epguides (jeśli jest link).
  function tytulHtml(r){
    const t = escapeHtml(r.tytul || '(bez tytułu)');
    const l = (r.link_epguides || '').trim();
    if(/^https?:\/\//i.test(l)) return '<a href="' + escapeHtml(l) + '" target="_blank" rel="noopener">' + t + '</a>';
    return t;
  }

  function fmtGb(gb){
    gb = Number(gb) || 0;
    return gb >= 1000 ? (gb / 1000).toFixed(1).replace('.', ',') + ' TB' : Math.round(gb) + ' GB';
  }

  let liczbaNowosci = 0;   // ile pozycji czeka w tabeli Nowosci (kropka przy zakładce)
  let nowosciTvIds = new Set();   // numery TVmaze pozycji z Nowości

  function renderujNav(){
    document.getElementById('nav').innerHTML = ZAKLADKI.map(z =>
      '<a href="' + ADRES_STRON + z[1] + '" target="_top"' +
      (z[0] === AKTYWNA_ZAKLADKA ? ' class="active"' : '') + '>' + escapeHtml(z[0]) +
      (z[0] === 'nowości' && liczbaNowosci > 0 ? ' <span class="kropka" title="' + liczbaNowosci + ' do przejrzenia">●</span>' : '') + '</a>'
    ).join('');
  }

  function renderujDyski(){
    const nazwy = ['dysk_0', 'dysk_1', 'dysk_2'];
    const html = nazwy.map((nazwa, indeks) => {
      const wiersz = dyskiDane.find(d => d.dysk === nazwa) || {};
      const pojemnosc = Number(wiersz.pojemnosc_gb) || 0;
      const wolne = Number(wiersz.wolne_gb) || 0;
      const wSerialach = wszystkieRekordy
        .filter(r => r.dysk === nazwa)
        .reduce((suma, r) => suma + (Number(r.rozmiar_gb) || 0), 0);

      let procent = null, opis;
      if(pojemnosc > 0){
        procent = Math.max(0, Math.min(100, Math.round((pojemnosc - wolne) / pojemnosc * 100)));
        opis = fmtGb(pojemnosc - wolne) + ' / ' + fmtGb(pojemnosc) + ' · ' + fmtGb(wolne) + ' wolne';
      } else {
        opis = 'brak danych o pojemności · seriale: ' + fmtGb(wSerialach);
      }
      const wypelnione = procent === null ? 0 : Math.round(procent / 100 * LICZBA_KLATEK);
      let klatki = '';
      for(let i = 0; i < LICZBA_KLATEK; i++){
        klatki += '<div class="filmstrip-frame' + (i < wypelnione ? ' filled dysk' + indeks : '') + '"></div>';
      }
      return '<div class="disk-gauge">' +
        '<div class="disk-gauge-label">' + nazwa + ' <span>' + (procent === null ? '—' : procent + '%') + '</span></div>' +
        '<div class="filmstrip">' + klatki + '</div>' +
        '<div class="disk-gauge-detail">' + escapeHtml(opis) + '</div>' +
      '</div>';
    }).join('');
    document.getElementById('dyski').innerHTML = html;
  }

  function renderujChipy(policzone, ob){
    const etykiety = ['wszystkie'].concat(STATUSY_W_WIDOKU);
    let html = etykiety.map(s => {
      const ile = s === 'wszystkie'
        ? STATUSY_W_WIDOKU.reduce((suma, st) => suma + (policzone[st] || 0), 0)
        : (policzone[s] || 0);
      return '<button class="chip' + (s === filtrStatusu ? ' active' : '') +
        '" data-status="' + escapeHtml(s) + '">' + escapeHtml(s) + ' (' + ile + ')</button>';
    }).join('');
    if(mamObejrzane && ob){
      html += '<span class="chips-sep"></span>' +
        '<button class="chip chip-ob' + (filtrObejrzenia === 'do' ? ' active' : '') + '" data-obf="do">nieobejrzane (' + ob.doObejrzenia + ')</button>' +
        '<button class="chip chip-ob' + (filtrObejrzenia === 'ob' ? ' active' : '') + '" data-obf="ob">obejrzane (' + ob.obejrzane + ')</button>';
    }
    if(mamKartofel && ob){
      html += (mamObejrzane ? '' : '<span class="chips-sep"></span>') +
        '<button class="chip chip-kart' + (filtrKartofla ? ' active' : '') + '" data-kart="1">' + IKONA_DO + ' do obejrzenia (' + ob.kartofle + ')</button>';
    }
    document.getElementById('chips').innerHTML = html;
  }

  function renderujPager(liczbaStron){
    const html = liczbaStron <= 1 ? '' :
      '<button data-akcja="wstecz" aria-label="poprzednia strona"' + (strona <= 1 ? ' disabled' : '') + '>‹</button>' +
      '<span class="info">' + strona + ' / ' + liczbaStron + '</span>' +
      '<button data-akcja="dalej" aria-label="następna strona"' + (strona >= liczbaStron ? ' disabled' : '') + '>›</button>';
    document.getElementById('pager-gora').innerHTML = html;
    document.getElementById('pager-dol').innerHTML = html;
    // widoki bez filtrów statusu: górny wiersz pokazujemy tylko wtedy, gdy są strzałki
    const wiersz = document.getElementById('filtry');
    if(wiersz && !document.getElementById('chips')) wiersz.style.display = html ? 'flex' : 'none';
  }

  function renderuj(){
    const fraza = document.getElementById('szukaj').value.trim().toLowerCase();
    const lista = document.getElementById('lista');
    const pusto = document.getElementById('pusto');
    lista.innerHTML = '';

    const wWidoku = wszystkieRekordy
      .filter(r => STATUSY_W_WIDOKU.includes(r.status))
      .filter(r => !fraza || (r.tytul || '').toLowerCase().includes(fraza));

    const policzone = {};
    wWidoku.forEach(r => { policzone[r.status] = (policzone[r.status] || 0) + 1; });
    const nieobejrzane = mamObejrzane ? wWidoku.filter(r => !czyObejrzany(r)).length : 0;
    renderujChipy(policzone, { doObejrzenia: nieobejrzane, obejrzane: wWidoku.length - nieobejrzane, kartofle: wWidoku.filter(r => r.do_obejrzenia).length });

    const pasujace = wWidoku
      .filter(r => filtrStatusu === 'wszystkie' || r.status === filtrStatusu)
      .filter(r => !mamObejrzane || filtrObejrzenia === 'wszystkie' || (filtrObejrzenia === 'ob' ? czyObejrzany(r) : !czyObejrzany(r)))
      .filter(r => !filtrKartofla || r.do_obejrzenia)
      .sort((a, b) => (a.tytul || '').localeCompare(b.tytul || '', 'pl'));

    const liczbaStron = Math.max(1, Math.ceil(pasujace.length / NA_STRONE));
    if(strona > liczbaStron) strona = liczbaStron;
    if(strona < 1) strona = 1;

    const start = (strona - 1) * NA_STRONE;
    const naStronie = pasujace.slice(start, start + NA_STRONE);

    document.getElementById('licznik').textContent = pasujace.length === 0
      ? '0 pozycji'
      : (start + 1) + '–' + (start + naStronie.length) + ' z ' + pasujace.length;

    renderujPager(liczbaStron);

    if(pasujace.length === 0){
      pusto.style.display = 'block';
      return;
    }
    pusto.style.display = 'none';

    naStronie.forEach(r => {
      const karta = document.createElement('div');
      karta.className = 'card';

      const sezony = liczbaSezonow(r.historia_sezonow);
      const metaCzesci = [r.rok, r.kraj].filter(Boolean);
      if(sezony > 0) metaCzesci.push(odmianaSezonow(sezony));
      let kolejnyHtml = '';
      if(r.kolejny){
        const data = dataPL(r.kolejny_data);
        kolejnyHtml = '<div class="kolejny">kolejny: <strong>' + escapeHtml(r.kolejny) + '</strong>' +
          (data ? ' · ' + escapeHtml(data) : ' · data nieznana') +
          (Number(r.zalegle) > 0 ? '<span class="zaleglosc">+' + Number(r.zalegle) + ' do nadrobienia</span>' : '') + '</div>';
      }
      const historiaHtml = r.historia_sezonow
        ? '<details><summary>historia sezonów</summary><div class="history-block">' + escapeHtml(r.historia_sezonow) + '</div></details>'
        : '';

      const model = POKAZ_ODCINKI ? modelOdcinkow(r) : null;
      let nastepnyHtml = '', dolHtml = '';
      const obejrzaneHtml = mamObejrzane ? wierszObejrzanych(r) : '';
      if(model){
        kolejnyHtml = '';
        nastepnyHtml = pigulkaKolejnego(model);
        dolHtml = '<div class="card-dol">' + siatkaOdcinkow(r, model) + obejrzaneHtml + '</div>';
      } else if(obejrzaneHtml){
        dolHtml = '<div class="card-dol">' + obejrzaneHtml + '</div>';
      }
      const obejrzanyTag = (mamObejrzane && czyObejrzany(r)) ? '<div class="obejrzany-tag">✓ obejrzany</div>' : '';
      karta.innerHTML =
        plakatHtml(r) +
        '<div class="card-main">' +
          '<h3>' + tytulHtml(r) + '</h3>' +
          '<div class="meta">' + escapeHtml(metaCzesci.join(' · ')) + '</div>' +
          kolejnyHtml +
          '<p class="desc">' + escapeHtml(r.opis || '') + '</p>' +
          historiaHtml +
        '</div>' +
        '<div class="card-side">' +
          nastepnyHtml +
          '<label class="tag ' + escapeHtml(r.status || '') + '">' + escapeHtml(r.status || '—') + ' ▾' +
            '<select class="status-wybor" data-id="' + r.id + '" aria-label="status">' +
              ['oczekiwany', 'emitowany', 'kompletny', 'niekompletny'].map(o => '<option value="' + o + '"' + (o === r.status ? ' selected' : '') + '>' + o + '</option>').join('') +
            '</select></label>' +
          (mamKartofel ? '<button class="kartofel' + (r.do_obejrzenia ? ' on' : '') + '" data-kartofel="' + r.id + '" aria-label="do obejrzenia">' + IKONA_DO + (r.do_obejrzenia ? '<span>do obejrzenia</span>' : '') + '</button>' : '') +
          obejrzanyTag +
          '<label class="location-btn' + (r.dysk ? '' : ' brak') + '">' +
            escapeHtml(r.dysk || 'wybierz dysk') + (r.rozmiar_gb ? ' · ' + Number(r.rozmiar_gb).toFixed(1) + ' GB' : '') +
            '<select class="dysk-wybor" data-id="' + r.id + '" aria-label="dysk">' +
              ['', 'dysk_0', 'dysk_1', 'dysk_2'].map(o => '<option value="' + o + '"' + (o === (r.dysk || '') ? ' selected' : '') + '>' + (o || '— brak —') + '</option>').join('') +
            '</select></label>' +
          '<button class="usun-btn' + (usunPotwierdzId === r.id ? ' confirm' : '') + '" data-usun="' + r.id + '">' +
            (usunPotwierdzId === r.id ? 'na pewno?' : 'usuń') + '</button>' +
        '</div>' + dolHtml;
      lista.appendChild(karta);
    });
  }

  // ---- Odcinki do odklikiwania (widok seriali w trakcie emisji) ----
  function pad2(n){ return String(n).padStart(2, '0'); }
  function dzisISO(){ return new Date().toISOString().slice(0, 10); }
  function isoPL(iso){
    if(!iso) return '';
    const p = iso.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  function isoNaEpoke(iso){
    if(!iso) return null;
    const p = iso.split('-').map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]) / 1000;
  }

  let komunikatTimer = null;
  function pokazKomunikat(tekst){
    const el = document.getElementById('komunikat');
    if(!el) return;
    el.textContent = tekst;
    el.style.display = tekst ? 'block' : 'none';
    clearTimeout(komunikatTimer);
    if(tekst) komunikatTimer = setTimeout(() => { el.style.display = 'none'; }, 7000);
  }

  // "S03: 2026-10-23 2026-10-30 ?" -> Map(3 -> ['2026-10-23', '2026-10-30', null])
  function parsujTvm(tekst){
    const mapa = new Map();
    (tekst || '').split('\n').forEach(linia => {
      const m = /^S(\d{1,3}):\s*(.*)$/.exec(linia.trim());
      if(!m) return;
      const tokeny = m[2].trim().split(/\s+/).filter(Boolean);
      mapa.set(Number(m[1]), tokeny.map(t => /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : null));
    });
    return mapa;
  }

  // "[~] S03: 03/10 odc. {01-03,05}" -> Map(3 -> Set{1,2,3,5})
  function parsujNagrane(tekst){
    const wynik = new Map();
    (tekst || '').split('\n').forEach(linia => {
      const m = /S(\d{1,3}):\s*(\d+)\s*\/\s*(\d+|\?\?)/.exec(linia);
      if(!m) return;
      const nr = Number(m[1]), n = Number(m[2]);
      const zbior = new Set();
      const b = /\{([^}]*)\}/.exec(linia);
      if(b){
        b[1].split(',').forEach(cz => {
          const p = cz.trim();
          const r = /^(\d+)\s*-\s*(\d+)$/.exec(p);
          if(r){ for(let e = Number(r[1]); e <= Number(r[2]) && e < 10000; e++) zbior.add(e); }
          else if(/^\d+$/.test(p)) zbior.add(Number(p));
        });
      } else if(n > 0){
        for(let e = 1; e <= n; e++) zbior.add(e);
      }
      wynik.set(nr, zbior);
    });
    return wynik;
  }

  function zakresy(zbior){
    const a = Array.from(zbior).sort((x, y) => x - y);
    const out = [];
    let s = null, p = null;
    const zamknij = () => { out.push(s === p ? pad2(s) : pad2(s) + '-' + pad2(p)); };
    a.forEach(e => {
      if(s === null){ s = p = e; }
      else if(e === p + 1){ p = e; }
      else { zamknij(); s = p = e; }
    });
    if(s !== null) zamknij();
    return out.join(',');
  }

  // ten sam format zapisuje skrypt sprawdz_odcinki.py
  function zapiszNagrane(mapa, liczby){
    return Array.from(mapa.keys()).sort((a, b) => a - b).map(nr => {
      const razem = liczby[nr] || 0;
      const trzymane = Array.from(mapa.get(nr)).filter(e => razem === 0 || e <= razem);
      const n = trzymane.length;
      const sym = n === 0 ? '[ ]' : (razem > 0 && n >= razem ? '[◇]' : '[~]');
      const baza = sym + ' S' + pad2(nr) + ': ' + pad2(n) + '/' + (razem ? pad2(razem) : '??') + ' odc.';
      return n > 0 ? baza + ' {' + zakresy(new Set(trzymane)) + '}' : baza;
    }).join('\n');
  }

  function najwSezonHistorii(tekst){
    let max = 0;
    const re = /S(\d{1,3})(?:\s*\(\d{4}\))?:/g;
    let m;
    while((m = re.exec(tekst || '')) !== null) max = Math.max(max, Number(m[1]));
    return max;
  }

  // Wpisuje sezon do historii jako ukończony (zmienia liczbę w istniejącej linii albo dopisuje nową).
  function ustawSezonWHistorii(tekst, nr, ile, rok){
    if(!ile) return tekst;   // sezon "ukończony" bez żadnego odcinka to sprzeczność - nie zapisujemy
    const linie = (tekst || '').trim() ? tekst.replace(/\s+$/, '').split('\n') : [];
    const wzorZRokiem = new RegExp('(S0*' + nr + '\\s*\\(\\d{4}\\):\\s*)(\\d+|\\?\\?)');
    const wzorBezRoku = new RegExp('(S0*' + nr + ':\\s*)(\\d+|\\?\\?)');
    for(let i = 0; i < linie.length; i++){
      if(wzorZRokiem.test(linie[i])){
        linie[i] = linie[i].replace(wzorZRokiem, (cale, przed) => przed + pad2(ile));
        return linie.join('\n');
      }
      if(wzorBezRoku.test(linie[i])){
        linie[i] = rok
          ? linie[i].replace(wzorBezRoku, () => 'S' + pad2(nr) + ' (' + rok + '): ' + pad2(ile))
          : linie[i].replace(wzorBezRoku, (cale, przed) => przed + pad2(ile));
        return linie.join('\n');
      }
    }
    const nowaLinia = '[✓] S' + pad2(nr) + (rok ? ' (' + rok + ')' : '') + ': ' + pad2(ile) + ' odc.';
    linie.push(nowaLinia);
    return linie.join('\n');
  }

  // Model karty: co nagrane, jaki odcinek jest kolejny, ile zaległych
  function modelOdcinkow(r){
    const tvm = parsujTvm(r.odcinki_tvm);
    if(tvm.size === 0) return null;
    const nagrane = parsujNagrane(r.odcinki_nagrane);
    const najw = najwSezonHistorii(r.historia_sezonow);
    const dzis = dzisISO();
    const sezony = Array.from(tvm.keys()).sort((a, b) => a - b);
    const nagrany = (s, e) => nagrane.has(s) ? nagrane.get(s).has(e) : s <= najw;
    let kolejny = null, zalegle = 0;
    sezony.forEach(s => {
      tvm.get(s).forEach((data, i) => {
        const e = i + 1;
        if(!nagrany(s, e)){
          if(!kolejny) kolejny = { s: s, e: e, data: data };
          if(data && data <= dzis) zalegle++;
        }
      });
    });
    return { tvm, nagrane, najw, dzis, sezony, nagrany, kolejny, zalegle };
  }

  // Status wynikający z kolejnego odcinka (te same zasady co w skrypcie sprawdz_odcinki.py)
  function statusZModelu(m, statusTvm){
    if(m.kolejny){
      if(m.kolejny.e === 1) return (m.kolejny.data && m.kolejny.data <= m.dzis) ? 'emitowany' : 'oczekiwany';
      return 'emitowany';
    }
    return statusTvm === 'Ended' ? 'kompletny' : 'oczekiwany';
  }

  // ---- Obejrzane sezony (znacznik na poziomie sezonu, kolumna "obejrzane": np. "S01,S02" albo "ALL") ----
  function sezonyObejrzane(tekst){
    const zbior = new Set();
    const t = (tekst || '').toUpperCase();
    if(/\bALL\b/.test(t)) zbior.add('ALL');
    (t.match(/S(\d{1,3})/g) || []).forEach(x => zbior.add(Number(x.slice(1))));
    return zbior;
  }
  function zapiszObejrzane(zbior){
    if(zbior.has('ALL')) return 'ALL';
    return Array.from(zbior).filter(x => x !== 'ALL').sort((a, b) => a - b).map(n => 'S' + pad2(n)).join(',');
  }
  // numery sezonów, które da się obejrzeć: z historii sezonów i z dat odcinków
  function sezonyKarty(r){
    const numery = new Set();
    const re = /S(\d{1,3})(?:\s*\(\d{4}\))?:/g;
    let m;
    const h = r.historia_sezonow || '';
    while((m = re.exec(h)) !== null) numery.add(Number(m[1]));
    parsujTvm(r.odcinki_tvm).forEach((_, k) => numery.add(k));
    numery.delete(0);
    return Array.from(numery).sort((a, b) => a - b);
  }
  function czyObejrzany(r){
    const ob = sezonyObejrzane(r.obejrzane);
    if(ob.has('ALL')) return true;
    const sezony = sezonyKarty(r);
    return sezony.length > 0 && sezony.every(n => ob.has(n));
  }
  function wierszObejrzanych(r){
    const ob = sezonyObejrzane(r.obejrzane);
    const sezony = sezonyKarty(r);
    let chipy;
    if(sezony.length === 0){
      chipy = '<button class="season-chip' + (ob.has('ALL') ? ' obejrzany' : '') + '" data-ob="ALL" data-id="' + r.id + '">całość</button>';
    } else {
      chipy = sezony.map(n => '<button class="season-chip' + ((ob.has('ALL') || ob.has(n)) ? ' obejrzany' : '') +
        '" data-ob="' + n + '" data-id="' + r.id + '">S' + pad2(n) + '</button>').join('');
      chipy += '<button class="mini-btn" data-ob="WSZYSTKIE" data-id="' + r.id + '">wszystkie</button>';
    }
    return '<div class="obejrzane-row"><span class="obej-etykieta">obejrzane</span>' + chipy + '</div>';
  }
  async function zmienObejrzane(id, ktore){
    const r = wszystkieRekordy.find(x => x.id === id);
    if(!r) return;
    const sezony = sezonyKarty(r);
    const zbior = sezonyObejrzane(r.obejrzane);
    if(ktore === 'ALL'){
      const bylo = zbior.has('ALL');
      zbior.clear();
      if(!bylo) zbior.add('ALL');
    } else if(ktore === 'WSZYSTKIE'){
      const wszystkie = zbior.has('ALL') || sezony.every(n => zbior.has(n));
      zbior.clear();
      if(!wszystkie) sezony.forEach(n => zbior.add(n));
    } else {
      if(zbior.has('ALL')){ zbior.clear(); sezony.forEach(n => zbior.add(n)); }
      const n = Number(ktore);
      if(zbior.has(n)) zbior.delete(n); else zbior.add(n);
    }
    const stary = r.obejrzane || '';
    const nowy = zapiszObejrzane(zbior);
    r.obejrzane = nowy;
    renderuj();
    try{
      await grist.docApi.applyUserActions([['UpdateRecord', 'Seriale', id, { obejrzane: nowy }]]);
    } catch(e){
      r.obejrzane = stary;
      renderuj();
      pokazBlad('nie udało się zapisać obejrzanych sezonów: ' + e.message);
    }
  }
  function obsluzObejrzane(ev){
    const b = ev.target.closest('button[data-ob]');
    if(!b) return false;
    zmienObejrzane(Number(b.dataset.id), b.dataset.ob);
    return true;
  }

  function pigulkaKolejnego(m){
    if(!m || !m.kolejny) return '';
    const dostepny = m.kolejny.data && m.kolejny.data <= m.dzis;
    return '<div class="nastepny' + (dostepny ? ' dostepny' : '') + '" title="kolejny odcinek: S' +
      pad2(m.kolejny.s) + 'E' + pad2(m.kolejny.e) + '">' + (dostepny ? '●' : '○') + ' ' +
      escapeHtml(m.kolejny.data ? isoPL(m.kolejny.data) : 'brak daty') + '</div>';
  }

  function siatkaOdcinkow(r, m){
    let wybrany = wybranySezon[r.id];
    if(!m.tvm.has(wybrany)) wybrany = m.kolejny ? m.kolejny.s : m.sezony[m.sezony.length - 1];

    const chipy = m.sezony.map(s => {
      const dane = m.tvm.get(s);
      const nagr = dane.filter((_, i) => m.nagrany(s, i + 1)).length;
      let klasa = 'season-chip';
      if(dane.length && nagr >= dane.length) klasa += ' done';
      else if(nagr > 0) klasa += ' partial';
      if(s === wybrany) klasa += ' selected';
      return '<button class="' + klasa + '" data-oa="sezon" data-id="' + r.id + '" data-nr="' + s + '">S' + pad2(s) + '</button>';
    }).join('');

    const dane = m.tvm.get(wybrany) || [];
    const nagrDla = dane.filter((_, i) => m.nagrany(wybrany, i + 1)).length;
    const wyemitowane = dane.filter(d => d && d <= m.dzis).length;
    let piksele = '';
    let maxNagrany = 0;
    dane.forEach((_, i) => { if(m.nagrany(wybrany, i + 1)) maxNagrany = i + 1; });
    dane.forEach((data, i) => {
      const e = i + 1;
      const nagrany = m.nagrany(wybrany, e);
      const przyszly = !!data && data > m.dzis;
      const jestKolejny = m.kolejny && m.kolejny.s === wybrany && m.kolejny.e === e;
      let klasa = 'ep-pixel';
      if(nagrany) klasa += ' done';
      else if(przyszly) klasa += ' przyszly';
      else if(!data) klasa += ' brak-daty';
      else klasa += ' do-nagrania';
      if(!nagrany && data && data <= m.dzis && e < maxNagrany) klasa += ' luka';
      if(jestKolejny && !nagrany) klasa += ' kolejny-odc';
      piksele += '<button class="' + klasa + '" data-oa="odc" data-id="' + r.id + '" data-nr="' + wybrany +
        '" data-odc="' + e + '"' + (przyszly && !nagrany ? ' disabled' : '') +
        ' title="S' + pad2(wybrany) + 'E' + pad2(e) + (data ? ' · ' + isoPL(data) : ' · brak daty') + '">' + pad2(e) + '</button>';
    });

    return '<div class="season-row">' + chipy + '</div>' +
      '<div class="ep-progress"><span>S' + pad2(wybrany) + ' — nagrane ' + nagrDla + ' / ' + dane.length +
      ' · wyemitowane ' + wyemitowane + (m.zalegle > 0 ? '<span class="zaleglosc">do nadrobienia: ' + m.zalegle + '</span>' : '') + '</span>' +
      '<button class="mini-btn" data-oa="wszystkie" data-id="' + r.id + '" data-nr="' + wybrany + '">wszystkie wyemitowane</button>' +
      '<button class="mini-btn" data-oa="wyczysc" data-id="' + r.id + '" data-nr="' + wybrany + '">wyczyść</button></div>' +
      '<div class="ep-grid">' + piksele + '</div>';
  }

  let wybranySezon = {};   // id rekordu -> numer wybranego sezonu

  async function zmienOdcinki(id, nr, akcja, odc){
    const r = wszystkieRekordy.find(x => x.id === id);
    if(!r) return;
    const m = modelOdcinkow(r);
    if(!m || !m.tvm.has(nr)) return;
    const dane = m.tvm.get(nr);

    const nagrane = new Map();
    m.nagrane.forEach((zb, s) => nagrane.set(s, new Set(zb)));
    let zbior = nagrane.has(nr) ? nagrane.get(nr)
      : (nr <= m.najw ? new Set(dane.map((_, i) => i + 1)) : new Set());
    if(akcja === 'odc'){
      if(zbior.has(odc)) zbior.delete(odc); else zbior.add(odc);
    } else if(akcja === 'wszystkie'){
      dane.forEach((d, i) => { if(!d || d <= m.dzis) zbior.add(i + 1); });
    } else if(akcja === 'wyczysc'){
      zbior = new Set();
    }
    nagrane.set(nr, zbior);
    wybranySezon[id] = nr;

    // sezony w całości wyemitowane i nagrane -> do historii
    let historia = r.historia_sezonow || '';
    const zakonczone = [];
    nagrane.forEach((zb, s) => {
      const d = m.tvm.get(s);
      if(d && d.length && d.every((x, i) => zb.has(i + 1) && x && x <= m.dzis)) zakonczone.push(s);
    });
    zakonczone.forEach(s => {
      const dni = (m.tvm.get(s) || []).filter(Boolean).sort();
      const rokSezonu = dni.length ? Number(dni[0].slice(0, 4)) : null;
      historia = ustawSezonWHistorii(historia, s, m.tvm.get(s).length, rokSezonu);
      nagrane.delete(s);
    });

    const liczby = {};
    m.tvm.forEach((v, k) => { liczby[k] = v.length; });
    const nagraneTxt = zapiszNagrane(nagrane, liczby);
    const nowy = modelOdcinkow({ odcinki_tvm: r.odcinki_tvm, odcinki_nagrane: nagraneTxt, historia_sezonow: historia });
    const nowyStatus = statusZModelu(nowy, r.status_tvm);

    const pola = {
      odcinki_nagrane: nagraneTxt,
      kolejny: nowy.kolejny ? 'S' + pad2(nowy.kolejny.s) + 'E' + pad2(nowy.kolejny.e) : '',
      kolejny_data: nowy.kolejny ? isoNaEpoke(nowy.kolejny.data) : null,
      zalegle: nowy.zalegle,
    };
    if(historia !== (r.historia_sezonow || '')) pola.historia_sezonow = historia;
    if(zakonczone.length){
      // Domknięte sezony znikają z pola z datami - są już w historii, więc nie mają tu zostawiać
      // klikalnej zakładki. Zostaje tylko to, czego jeszcze nie domknęliśmy (np. kolejny, już
      // zapowiedziany sezon) - a jeśli nic takiego nie ma, pole robi się puste, tak jak dotąd.
      pola.odcinki_tvm = m.sezony
        .filter(s => !zakonczone.includes(s))
        .map(s => 'S' + pad2(s) + ': ' + (m.tvm.get(s) || []).map(d => d || '?').join(' '))
        .join('\n');
    }
    if(nowyStatus !== r.status) pola.status = nowyStatus;

    const stare = {};
    Object.keys(pola).forEach(k => { stare[k] = r[k]; });
    Object.assign(r, pola);
    renderuj();
    if(zakonczone.length){
      pokazKomunikat('sezon ' + zakonczone.map(s => 'S' + pad2(s)).join(', ') + ' skompletowany' +
        (pola.status ? ' — status: ' + pola.status : ''));
    }
    try{
      await grist.docApi.applyUserActions([['UpdateRecord', 'Seriale', id, pola]]);
    } catch(e){
      Object.assign(r, stare);
      renderuj();
      pokazBlad('nie udało się zapisać odcinków: ' + e.message);
    }
  }

  // Obsługa kliknięć w sezony i odcinki; zwraca true, jeśli kliknięcie było "nasze"
  function obsluzOdcinki(ev){
    const btn = ev.target.closest('button[data-oa]');
    if(!btn || btn.disabled) return false;
    const id = Number(btn.dataset.id);
    const nr = Number(btn.dataset.nr);
    const akcja = btn.dataset.oa;
    if(akcja === 'sezon'){ wybranySezon[id] = nr; renderuj(); }
    else zmienOdcinki(id, nr, akcja, Number(btn.dataset.odc));
    return true;
  }

  async function dodajRecznie(d){
    const f = doFormatuBazy(d.tytul);
    const rok = d.rok || f.rokZNazwy;
    const t = f.tytul.toLowerCase();
    const istniejacy = wszystkieRekordy.find(x => (x.tytul || '').toLowerCase() === t &&
      (!rok || !x.rok || Number(x.rok) === Number(rok)));
    if(istniejacy){
      pokazBlad('„' + f.tytul + '” jest już w bazie (status: ' + (istniejacy.status || '—') + ')');
      return;
    }
    const pola = { tytul: f.tytul, status: STATUS_NOWEGO };
    if(rok) pola.rok = rok;
    if(d.kraj) pola.kraj = d.kraj;
    if(d.link) pola.link_epguides = d.link;
    try{
      await grist.docApi.applyUserActions([['AddRecord', 'Seriale', null, pola]]);
      przelaczPanel(false);
      wyczyscFormularz();
      pokazKomunikat('dodano „' + f.tytul + '” (status: ' + STATUS_NOWEGO + ')');
      await wczytajDane();
    } catch(e){
      pokazBlad('nie udało się dodać: ' + e.message);
    }
  }

  async function zmienDysk(sel){
    const id = Number(sel.dataset.id);
    const r = wszystkieRekordy.find(x => x.id === id);
    if(!r) return;
    const stary = r.dysk || '';
    r.dysk = sel.value;
    renderuj();
    renderujDyski();
    try{
      await grist.docApi.applyUserActions([['UpdateRecord', 'Seriale', id, { dysk: sel.value }]]);
    } catch(e){
      r.dysk = stary;
      renderuj();
      renderujDyski();
      pokazBlad('nie udało się zmienić dysku: ' + e.message);
    }
  }

  async function usunSerial(id){
    const r = wszystkieRekordy.find(x => x.id === id);
    const tytul = r ? r.tytul : '';
    try{
      await grist.docApi.applyUserActions([['RemoveRecord', 'Seriale', id]]);
      wszystkieRekordy = wszystkieRekordy.filter(x => x.id !== id);
      usunPotwierdzId = null;
      renderuj();
      renderujDyski();
      pokazKomunikat('usunięto „' + tytul + '”');
    } catch(e){
      pokazBlad('nie udało się usunąć: ' + e.message);
    }
  }

  function dataPL(sekundy){
    if(typeof sekundy !== 'number' || !isFinite(sekundy)) return '';
    const d = new Date(sekundy * 1000);
    return String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') + '.' + d.getUTCFullYear();
  }

  async function zmienStatus(sel){
    const id = Number(sel.dataset.id);
    const rekord = wszystkieRekordy.find(r => r.id === id);
    if(!rekord) return;
    const stary = rekord.status, nowy = sel.value;
    if(nowy === stary) return;
    sel.disabled = true;
    try{
      await grist.docApi.applyUserActions([['UpdateRecord', 'Seriale', id, { status: nowy }]]);
      rekord.status = nowy;
    } catch(e){
      pokazBlad('nie udało się zapisać zmiany statusu: ' + e.message);
      rekord.status = stary;
    }
    renderuj();
  }

  async function przelaczKartofla(id){
    const r = wszystkieRekordy.find(x => x.id === id);
    if(!r) return;
    const nowy = !r.do_obejrzenia;
    r.do_obejrzenia = nowy;
    renderuj();
    try{
      await grist.docApi.applyUserActions([['UpdateRecord', 'Seriale', id, { do_obejrzenia: nowy }]]);
    } catch(e){
      r.do_obejrzenia = !nowy;
      pokazBlad('nie udało się zapisać znacznika: ' + e.message);
      renderuj();
    }
  }

  async function wczytajDyski(){
    try{
      const t = await grist.docApi.fetchTable('Dyski');
      dyskiDane = [];
      for(let i = 0; i < t.id.length; i++){
        dyskiDane.push({
          dysk: t.dysk ? t.dysk[i] : '',
          pojemnosc_gb: t.pojemnosc_gb ? t.pojemnosc_gb[i] : 0,
          wolne_gb: t.wolne_gb ? t.wolne_gb[i] : 0,
        });
      }
    } catch(e){
      dyskiDane = [];   // brak tabeli Dyski nie powinien blokować reszty widoku
    }
    try{
      const n = await grist.docApi.fetchTable('Nowosci');
      liczbaNowosci = n.id.length;
      nowosciTvIds = new Set();
      (n.tvmaze_id || []).forEach(x => { if(Number(x) > 0) nowosciTvIds.add(Number(x)); });
      (n.link_epguides || []).forEach(l => { const m = /tvmaze\.com\/shows\/(\d+)/.exec(l || ''); if(m) nowosciTvIds.add(Number(m[1])); });
    } catch(e){
      liczbaNowosci = 0;
    }
    renderujNav();
  }

  async function wczytajDane(){
    try{
      const tabela = await grist.docApi.fetchTable('Seriale');
      const liczbaWierszy = tabela.id.length;
      mamObejrzane = Boolean(tabela.obejrzane);
      mamKartofel = Boolean(tabela.do_obejrzenia);
      wszystkieRekordy = [];
      for(let i = 0; i < liczbaWierszy; i++){
        wszystkieRekordy.push({
          id: tabela.id[i],
          tytul: tabela.tytul ? tabela.tytul[i] : '',
          rok: tabela.rok ? tabela.rok[i] : '',
          kraj: tabela.kraj ? tabela.kraj[i] : '',
          status: tabela.status ? tabela.status[i] : '',
          dysk: tabela.dysk ? tabela.dysk[i] : '',
          rozmiar_gb: tabela.rozmiar_gb ? tabela.rozmiar_gb[i] : 0,
          opis: tabela.opis ? tabela.opis[i] : '',
          plakat_tmdb: tabela.plakat_tmdb ? tabela.plakat_tmdb[i] : '',
          plakat_url: tabela.plakat_url ? tabela.plakat_url[i] : '',
          link_epguides: tabela.link_epguides ? tabela.link_epguides[i] : '',
          odcinki_tvm: tabela.odcinki_tvm ? tabela.odcinki_tvm[i] : '',
          odcinki_nagrane: tabela.odcinki_nagrane ? tabela.odcinki_nagrane[i] : '',
          status_tvm: tabela.status_tvm ? tabela.status_tvm[i] : '',
          obejrzane: tabela.obejrzane ? tabela.obejrzane[i] : '',
          kolejny: tabela.kolejny ? tabela.kolejny[i] : '',
          kolejny_data: tabela.kolejny_data ? tabela.kolejny_data[i] : null,
          zalegle: tabela.zalegle ? tabela.zalegle[i] : 0,
          historia_sezonow: tabela.historia_sezonow ? tabela.historia_sezonow[i] : '',
          do_obejrzenia: tabela.do_obejrzenia ? Boolean(tabela.do_obejrzenia[i]) : false,
        });
      }
      await wczytajDyski();
      renderujDyski();
      renderuj();
    } catch(e){
      pokazBlad('nie udało się wczytać danych z Grista: ' + e.message);
    }
  }

  // Jedna obsługa kliknięć dla całej strony.
  document.addEventListener('click', (ev) => {
    const usunBtn = ev.target.closest('button[data-usun]');
    if(usunBtn){
      const id = Number(usunBtn.dataset.usun);
      if(usunPotwierdzId === id){ usunSerial(id); }
      else { usunPotwierdzId = id; renderuj(); }
      return;
    }
    const bylPotwierdzUsun = usunPotwierdzId !== null;
    usunPotwierdzId = null;
    if(obsluzObejrzane(ev)) return;
    const chipOb = ev.target.closest('.chip[data-obf]');
    if(chipOb){ filtrObejrzenia = (filtrObejrzenia === chipOb.dataset.obf) ? 'wszystkie' : chipOb.dataset.obf; strona = 1; renderuj(); return; }
    if(POKAZ_ODCINKI && obsluzOdcinki(ev)) return;
    const kart = ev.target.closest('button[data-kartofel]');
    if(kart){ przelaczKartofla(Number(kart.dataset.kartofel)); return; }
    const chipKart = ev.target.closest('.chip[data-kart]');
    if(chipKart){ filtrKartofla = !filtrKartofla; strona = 1; renderuj(); return; }

    const chip = ev.target.closest('.chip[data-status]');
    if(chip){ filtrStatusu = chip.dataset.status; strona = 1; renderuj(); return; }

    const pagerBtn = ev.target.closest('.pager button[data-akcja]');
    if(pagerBtn){
      if(!pagerBtn.disabled){
        strona += (pagerBtn.dataset.akcja === 'dalej') ? 1 : -1;
        renderuj();
        window.scrollTo(0, 0);
      }
      return;
    }

    const dysk = ev.target.closest('.disk-gauge');
    const bylOtwarty = dysk && dysk.classList.contains('open');
    document.querySelectorAll('.disk-gauge.open').forEach(g => g.classList.remove('open'));
    if(dysk && !bylOtwarty) dysk.classList.add('open');
    if(bylPotwierdzUsun && !dysk) renderuj();
  });

  document.addEventListener('change', (ev) => {
    const sel = ev.target.closest('.dysk-wybor');
    if(sel) zmienDysk(sel);
    const st = ev.target.closest('.status-wybor');
    if(st) zmienStatus(st);
  });

  document.getElementById('szukaj').addEventListener('input', () => {
    strona = 1;
    renderuj();
  });

  renderujNav();
  renderujDyski();
  podepnijPanelDodawania(dodajRecznie);
  grist.ready({ requiredAccess: 'full' });
  grist.onRecords(wczytajDane);
  wczytajDane();
</script>

</body>
</html>
