<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lista życzeń — widget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{ color-scheme: light; –linie-opisu: 3; }   /* ile linii opisu widać na karcie */
*{ box-sizing: border-box; }
html{ background: #F4F7F8; color-scheme: light; }

body{
margin:0;
background: #F4F7F8;
color: #154565;
font-family: ‘Inter’, Calibri, ‘Segoe UI’, Helvetica, Arial, sans-serif;
line-height: 1.5;
font-weight: 400;
font-size: 14px;
}

/* ––––– nagłówek: tytuł, dyski, zakładki ––––– */
header{
padding: 16px 20px 14px;
border-bottom: 2px solid #154565;
display:flex; flex-direction:column; gap: 10px;
}
.header-row{
display:flex; justify-content: space-between; align-items: flex-start;
flex-wrap: wrap; gap: 16px 24px;
}
h1{
font-weight: 800; font-size: 1.9rem; margin: 0;
letter-spacing: -0.5px; color: #154565; line-height: 1.15;
}
nav{ display:flex; gap: 4px; flex-wrap: wrap; }
nav a{
font-weight: 600; font-size: 0.88rem;
border: 2px solid #154565; color: #154565; background: none;
padding: 8px 16px; cursor: pointer; border-radius: 8px;
text-decoration: none; display:inline-block;
}
nav a.active{ background: #154565; color: #F4F7F8; }
nav a:not(.active):hover{ background: #E8EEF2; }

.disk-strip-bar{ display:flex; gap: 22px; flex-wrap: wrap; align-items:flex-start; }
.disk-gauge{
display:flex; flex-direction:column; gap: 4px;
cursor: pointer; position: relative; min-width: 120px;
}
.disk-gauge-label{
font-size: 0.72rem; font-weight: 700; color: #154565;
display:flex; justify-content:space-between; align-items:baseline;
}
.disk-gauge-label span{ font-weight:500; color: #526A7A; font-size:0.68rem; }
.filmstrip{
display:flex; align-items:stretch;
background: transparent; border: solid #154565; border-width: 7px 4px; border-radius: 4px; position: relative;
}
.filmstrip::before, .filmstrip::after{
content:””; position:absolute; left:2px; right:2px; height:3px;
background-image: radial-gradient(circle, #E8EEF2 1.2px, transparent 1.4px);
background-size: 8px 3px; background-repeat: repeat-x;
}
.filmstrip::before{ top: -5px; }
.filmstrip::after{ bottom: -5px; }
.filmstrip-frame{ flex: 1; height: 14px; background: transparent; border-left: 3px solid #154565; }
.filmstrip-frame:first-child{ border-left: none; }
.filmstrip-frame.filled.dysk0{ background: #5EBAA3; }
.filmstrip-frame.filled.dysk1{ background: #4FA3DA; }
.filmstrip-frame.filled.dysk2{ background: #8C7CC0; }
.disk-gauge-detail{
display:none; position:absolute; top: calc(100% + 8px); left: 0;
background: #154565; color: #F4F7F8;
font-size: 0.74rem; white-space: nowrap; padding: 6px 10px; border-radius: 6px; z-index: 5;
}
.disk-gauge-detail::after{
content:””; position:absolute; bottom:100%; left: 18px;
border: 5px solid transparent; border-bottom-color: #154565;
}
.disk-gauge.open .disk-gauge-detail{ display:block; }

/* ––––– lista ––––– */
.wrap{ padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }

.toolbar{
display:flex; justify-content: space-between; align-items: center;
margin-bottom: 12px; flex-wrap: wrap; gap: 12px;
}
.toolbar input[type=text]{
font-family: inherit; font-size: 0.95rem; padding: 9px 12px;
border: none; border-bottom: 2px solid #154565; border-radius: 8px 8px 0 0;
background: transparent; width: 260px; color: #154565;
}
.toolbar input[type=text]:focus{ outline:none; border-bottom-color: #4FA3DA; }
.count{ font-size: 0.8rem; color: #526A7A; }

.filtry{ display:flex; justify-content: space-between; align-items:center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.filtry-dol{ margin: 16px 0 0; justify-content: flex-end; }
.chips{ display:flex; gap: 6px; flex-wrap: wrap; }
.chip{
font-family: inherit; font-weight: 600; font-size: 0.82rem;
background: none; border: 2px solid #4FA3DA; color: #2C7DB3;
padding: 7px 14px; cursor: pointer; border-radius: 8px;
}
.chip.active{ background: #4FA3DA; color: #F4F7F8; }
.chip:not(.active):hover{ background: #E8EEF2; }

.pager{ display:flex; align-items:center; gap: 8px; margin-left: auto; }
.pager button{
font-family: inherit; font-weight: 700; font-size: 1.3rem; line-height: 1;
border: 2px solid #154565; background: #F4F7F8; color: #154565;
width: 40px; height: 36px; padding: 0 0 3px; cursor: pointer; border-radius: 8px;
}
.pager button:hover:not(:disabled){ background: #154565; color: #F4F7F8; }
.pager button:disabled{ opacity: 0.35; cursor: default; }
.pager .info{ font-size: 0.85rem; color: #526A7A; min-width: 56px; text-align:center; }

.cards{ display:flex; flex-direction:column; gap: 8px; }

.card{
display: grid; grid-template-columns: 76px 1fr 200px; gap: 20px;
padding: 16px; align-items: start; position: relative; color: #154565;
}
.card:not(:first-child)::before{
content:””; position: absolute; top: -4px; left: 16px; right: 16px;
height: 1px; background: #BFCFD9;
}
.card:hover{ background: #E8EEF2; border-radius: 10px; }
.card:hover::before, .card:hover + .card::before{ display:none; }

.poster{
width: 76px; height: 106px; border-radius: 8px;
background-color: #154565;
background-image: linear-gradient(150deg, #4FA3DA, #154565);
display:flex; align-items:center; justify-content:center;
color: #F4F7F8; font-weight: 800; font-size: 1.5rem; flex-shrink:0;
position: relative; overflow: hidden;
}
.poster img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; }

.card-main h3{ font-weight: 700; font-size: 1.05rem; margin: 0 0 4px; color: #154565; }
.meta{ font-size: 0.8rem; color: #526A7A; margin-bottom: 8px; }
.desc{
font-size: 0.87rem; color: #526A7A; max-width: 72ch; margin: 0; cursor: pointer;
display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(–linie-opisu); line-clamp: var(–linie-opisu); overflow: hidden;
}
.desc.rozwiniete{ display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.card-main{ min-height: 118px; min-width: 0; }
.kolejny{ font-size: 0.82rem; color: #154565; margin: 0 0 8px; }
.kolejny .zaleglosc{ background: #FBEEE8; color: #B25A38; border-radius: 8px; padding: 1px 8px; font-weight: 600; margin-left: 6px; white-space: nowrap; }

.card-dol{ grid-column: 1 / -1; }
.card-main h3 a{ color: inherit; text-decoration: none; }
.card-main h3 a:hover{ text-decoration: underline; }
.komunikat{ display:none; background:#E7F3F0; border:1px solid #5EBAA3; color:#2E6E5D; padding:10px 14px; margin-bottom:12px; font-size:0.85rem; border-radius:8px; }
.nastepny{
font-weight: 800; font-size: 0.82rem; color: #CB704D; border: 2px solid #CB704D;
border-radius: 8px; padding: 5px 9px; width: 100%; text-align: center; background: none;
}
.nastepny.dostepny{ background: #CB704D; color: #FFFFFF; }
.season-row{ display:grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap:5px; margin:4px 0; }
.season-chip{
font-family: inherit; font-size: 0.74rem; font-weight: 600; border: 1px solid #BFCFD9; padding: 5px 4px;
cursor: pointer; color: #526A7A; text-align: center; border-radius: 8px; background: none;
}
.season-chip.done{ border-color: #5EBAA3; color: #2E6E5D; background: #E7F3F0; }
.season-chip.partial{ border-color: #4FA3DA; color: #2C7DB3; background: #E5EFF5; }
.season-chip.selected{ outline: 2px solid #154565; outline-offset: 1px; }
.ep-progress{ font-size: 0.76rem; color: #526A7A; margin: 8px 0 4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.ep-progress .zaleglosc{ background: #FBEEE8; color: #B25A38; border-radius: 8px; padding: 1px 8px; font-weight: 700; margin-left: 8px; }
.mini-btn{ font-family: inherit; font-size: 0.72rem; font-weight: 600; background: none; border: 1px solid #154565; color: #154565; padding: 4px 10px; cursor: pointer; border-radius: 8px; }
.mini-btn:hover{ background: #154565; color: #F4F7F8; }
.ep-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 8px 0 4px; }
.ep-pixel{
font-family: inherit; height: 28px; background: #FFFFFF; border: 1px solid #BFCFD9; cursor: pointer;
display:flex; align-items:center; justify-content:center; font-size: 0.68rem; font-weight: 600;
color: #526A7A; border-radius: 8px; padding: 0;
}
.ep-pixel.done{ background: #5EBAA3; border-color: #5EBAA3; color: #2E6E5D; }
.ep-pixel.do-nagrania{ border: 2px solid #CB704D; color: #B25A38; font-weight: 800; }
.ep-pixel.kolejny-odc{ background: #FBEEE8; }
.ep-pixel.luka{ background: #CB704D; border-color: #CB704D; color: #FFFFFF; }
.ep-pixel.przyszly{ background: #E8EEF2; border-style: dashed; color: #8AA0AE; cursor: default; }
.ep-pixel.brak-daty{ background: #E8EEF2; }

.toolbar-prawa{ display:flex; align-items:center; gap: 12px; }
.plus-btn{
font-family: inherit; font-weight: 700; font-size: 1.4rem; line-height: 1;
border: 2px solid #154565; background: #F4F7F8; color: #154565;
width: 40px; height: 36px; padding: 0 0 3px; cursor: pointer; border-radius: 8px;
}
.plus-btn:hover{ background: #154565; color: #F4F7F8; }
.dodaj-panel{
background: #E8EEF2; border: 1px solid #BFCFD9; border-radius: 10px; padding: 14px;
margin-bottom: 12px; grid-template-columns: 2fr 1fr 1fr; gap: 10px;
}
.dodaj-panel input{
font-family: inherit; font-size: 0.9rem; padding: 9px 10px; border: 1px solid #BFCFD9;
border-radius: 8px; background: #FFFFFF; color: #154565; min-width: 0;
}
.dodaj-panel input:focus{ outline: none; border-color: #4FA3DA; }
.dodaj-panel .szeroki{ grid-column: 1 / -1; }
.dodaj-przyciski{ display: flex; gap: 8px; }
.dodaj-zapisz{ font-family: inherit; font-weight: 700; font-size: 0.85rem; background: #4FA3DA; color: #F4F7F8; border: none; padding: 9px 18px; cursor: pointer; border-radius: 8px; }
.dodaj-zapisz:hover{ background: #154565; }
.dodaj-anuluj{ font-family: inherit; font-weight: 700; font-size: 0.85rem; background: none; color: #526A7A; border: 1px solid #BFCFD9; padding: 9px 18px; cursor: pointer; border-radius: 8px; }
.dodaj-anuluj:hover{ border-color: #154565; color: #154565; }

.link-btn{
font-family: inherit; font-weight: 600; font-size: 0.78rem; border: 1px solid #BFCFD9; color: #526A7A;
padding: 8px 12px; border-radius: 8px; text-decoration: none; background: none; white-space: nowrap;
}
.link-btn:hover{ border-color: #154565; color: #154565; }
.kropka{ color: #CB704D; }
nav a.active .kropka{ color: #F4B393; }
.location-btn{ position: relative; display: block; cursor: pointer; }
.location-btn.brak{ color: #526A7A; border-style: dashed; }
.dysk-wybor{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.obejrzane-row{ display:flex; align-items:center; gap: 6px; flex-wrap: wrap; margin: 10px 0 2px; }
.obej-etykieta{ font-size: 0.74rem; font-weight: 700; color: #154565; margin-right: 4px; }
.season-chip.obejrzany{ background: #154565; border-color: #154565; color: #F4F7F8; }
.obejrzane-row .season-chip{ min-width: 48px; padding: 5px 8px; }
.obejrzany-tag{
font-weight: 700; font-size: 0.72rem; padding: 6px 9px; border: 1px solid #154565; border-radius: 8px;
width: 100%; text-align: center; color: #F4F7F8; background: #154565;
}
.chips-sep{ width: 10px; }
.chip.chip-ob{ border-color: #154565; color: #154565; }
.chip.chip-ob.active{ background: #154565; color: #F4F7F8; }
.zrodlo{ text-align: center; font-size: 0.7rem; color: #526A7A; margin-top: 24px; }
.zrodlo a{ color: inherit; }

.card-side{ text-align: right; display:flex; flex-direction:column; align-items:flex-end; gap: 8px; }

.tag{
font-size: 0.72rem; font-weight: 600; padding: 6px 9px;
border: 1px solid #154565; border-radius: 8px; width: 100%;
text-align: center; box-sizing: border-box; cursor: pointer;
background: none; font-family: inherit;
}
.tag.oczekiwany{ border-color: #8C7CC0; color: #564785; background: #EDEAF5; }
.tag.emitowany{ border-color: #5EBAA3; color: #2E6E5D; background: #E7F3F0; }
.tag.kompletny{ border-color: #4FA3DA; color: #2C7DB3; background: #E5EFF5; }
.tag.niekompletny{ border-color: #CB704D; color: #B25A38; background: #FBEEE8; }
.tag:hover{ filter: brightness(0.95); }

.location-btn{
font-weight: 600; font-size: 0.72rem; border: 1px solid #154565; border-radius: 8px;
padding: 6px 9px; width: 100%; box-sizing: border-box; text-align: center;
color: #154565; background: #F4F7F8;
}

.empty{ text-align:center; color: #526A7A; padding: 40px 0; font-size: 0.9rem; }
.error{ background: #FBEEE8; border: 1px solid #CB704D; color: #B25A38; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; }

.komunikat{ display:none; background:#E7F3F0; border:1px solid #5EBAA3; color:#2E6E5D; padding:10px 14px; margin-bottom:12px; font-size:0.85rem; border-radius:8px; }

.list-item{
display:grid; grid-template-columns: 90px 1fr auto; gap: 18px;
padding: 16px; align-items:center; position: relative; color:#154565;
}
.list-item:not(:first-child)::before{
content:””; position:absolute; top:-4px; left:16px; right:16px; height:1px; background:#BFCFD9;
}
.list-item:hover{ background:#E8EEF2; border-radius:10px; }
.list-item:hover::before, .list-item:hover + .list-item::before{ display:none; }
.list-date{ font-size:0.78rem; color:#526A7A; }
.list-main h4{ margin:0 0 4px; font-weight:700; font-size:0.98rem; color:#154565; }
.list-main h4 a{ color:inherit; text-decoration:none; }
.list-main h4 a:hover{ text-decoration:underline; }
.list-main .meta{ margin-bottom:0; }
.btn-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.add-btn{
font-family:inherit; font-weight:700; font-size:0.78rem;
background:#4FA3DA; color:#F4F7F8; border:none; padding:9px 14px; cursor:pointer; border-radius:8px;
}
.add-btn:hover{ background:#154565; }
.add-btn.confirm{ background:#CB704D; }
.reject-btn{
font-family:inherit; font-weight:700; font-size:0.78rem;
background:none; color:#526A7A; border:1px solid #BFCFD9; padding:9px 14px; cursor:pointer; border-radius:8px;
}
.reject-btn:hover{ border-color:#CB704D; color:#CB704D; }
.reject-btn.confirm{ border-color:#CB704D; background:#CB704D; color:#F4F7F8; }
.tytul-edycja{
font-family: inherit; font-size: 0.85rem; padding: 8px 10px; border: 1px solid #4FA3DA; border-radius: 8px;
background: #FFFFFF; color: #154565; width: 230px; max-width: 100%;
}
.info-tag{
font-size:0.72rem; font-weight:600; padding:6px 9px; border:1px solid #4FA3DA;
color:#2C7DB3; background:#E5EFF5; border-radius:8px;
}

.zyczenie{ position:relative; padding:16px; color:#154565; }
.zyczenie:not(:first-child)::before{
content:””; position:absolute; top:-4px; left:16px; right:16px; height:1px; background:#BFCFD9;
}
.zyczenie:hover{ background:#E8EEF2; border-radius:10px; }
.zyczenie:hover::before, .zyczenie:hover + .zyczenie::before{ display:none; }
.zyczenie-top{ display:grid; grid-template-columns: 76px 1fr 200px; gap:20px; align-items:start; }
.suma{ font-size:0.8rem; color:#526A7A; }
.brak-sezonow{ font-size:0.8rem; color:#526A7A; margin-top:10px; }

.season-row{
display:grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
gap:5px; margin:12px 0 4px;
}
.season-chip{
font-family:inherit; font-size:0.74rem; font-weight:600;
border:1px solid #BFCFD9; padding:5px 4px; cursor:pointer; color:#526A7A;
text-align:center; border-radius:8px; background:none;
}
.season-chip.done{ border-color:#5EBAA3; color:#2E6E5D; background:#E7F3F0; }
.season-chip.partial{ border-color:#4FA3DA; color:#2C7DB3; background:#E5EFF5; }
.season-chip.selected{ outline:2px solid #154565; outline-offset:1px; }
.season-chip.nieznany{ opacity:0.5; cursor:default; }

.ep-progress{ font-size:0.76rem; color:#526A7A; margin:6px 0 4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.mini-btn{
font-family:inherit; font-size:0.72rem; font-weight:600; background:none;
border:1px solid #154565; color:#154565; padding:4px 10px; cursor:pointer; border-radius:8px;
}
.mini-btn:hover{ background:#154565; color:#F4F7F8; }
.ep-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap:6px; margin:8px 0 4px; }
.ep-pixel{
font-family:inherit; height:28px; background:#E8EEF2; border:1px solid #BFCFD9; cursor:pointer;
display:flex; align-items:center; justify-content:center;
font-size:0.68rem; font-weight:600; color:#526A7A; border-radius:8px; padding:0;
}
.ep-pixel.done{ background:#5EBAA3; border-color:#5EBAA3; color:#2E6E5D; }
.add-btn{
font-family:inherit; font-weight:700; font-size:0.78rem;
background:#4FA3DA; color:#F4F7F8; border:none; padding:9px 14px; cursor:pointer; border-radius:8px;
}
.add-btn:hover{ background:#154565; }
.add-btn.confirm{ background:#CB704D; }

.subtabs{ display:flex; gap: 6px; margin: 4px 0 14px; }
.subtabs button{
font-family: inherit; font-weight: 600; font-size: 0.88rem; border: 2px solid #4FA3DA; color: #2C7DB3;
background: none; padding: 8px 16px; cursor: pointer; border-radius: 8px;
}
.subtabs button.active{ background: #4FA3DA; color: #F4F7F8; }
.filtr-check{ font-size: 0.8rem; color: #526A7A; display:flex; align-items:center; gap: 6px; }
.stan-tv{ font-size: 0.82rem; color: #526A7A; margin: 0 0 10px; min-height: 1em; }
.dodaj-zapisz:disabled{ opacity: 0.4; cursor: default; }
</style>

</head>
<body>

<header>
  <div class="header-row">
    <h1>lista życzeń</h1>
    <div class="disk-strip-bar" id="dyski"></div>
  </div>
  <nav id="nav"></nav>
</header>

<div class="wrap">
  <div class="subtabs" id="subtabs">
    <button class="active" data-widok="lista">do zdobycia</button>
    <button data-widok="przegladaj">przeglądaj / szukaj</button>
  </div>
  <div class="komunikat" id="komunikat"></div>
  <div id="blad"></div>

  <div id="widok-lista">
    <div class="toolbar">
      <input type="text" id="szukaj" placeholder="szukaj tytułu…">
      <div class="toolbar-prawa"><div class="count" id="licznik"></div><button class="plus-btn" id="plus" title="dodaj ręcznie" aria-label="dodaj ręcznie">+</button></div>
    </div>
    <div class="dodaj-panel" id="dodaj-panel" style="display:none;">
      <input type="text" id="dodaj-tytul" placeholder="tytuł (np. The Wire)">
      <input type="text" id="dodaj-rok" placeholder="rok" inputmode="numeric" maxlength="4">
      <input type="text" id="dodaj-kraj" placeholder="kraj (np. US)" maxlength="6">
      <input type="text" id="dodaj-link" class="szeroki" placeholder="link do epguides (opcjonalnie)">
      <div class="dodaj-przyciski szeroki">
        <button class="dodaj-zapisz" id="dodaj-zapisz">dodaj</button>
        <button class="dodaj-anuluj" id="dodaj-anuluj">anuluj</button>
      </div>
    </div>
    <div class="filtry" id="filtry"><div class="pager" id="pager-gora"></div></div>
    <div class="cards" id="lista"></div>
    <div class="empty" id="pusto" style="display:none;">lista życzeń jest pusta</div>
    <div class="filtry filtry-dol"><div class="pager" id="pager-dol"></div></div>
  </div>

  <div id="widok-przegladaj" style="display:none;">
    <div class="toolbar">
      <input type="text" id="szukaj-tv" placeholder="szukaj w TVmaze…">
      <div class="toolbar-prawa">
        <label class="filtr-check"><input type="checkbox" id="tylko-fabularne" checked> tylko fabularne (EN)</label>
        <button class="dodaj-zapisz" id="nastepna-partia">pobierz kolejną partię (20)</button>
      </div>
    </div>
    <div class="stan-tv" id="stan-tv"></div>
    <div class="cards" id="lista-tv"></div>
  </div>
</div>

<script>
  const ADRES_STRON = 'https://dio.getgrist.com/tKjpkmVjijQj/SERIALE/p/';
  const ZAKLADKI = [['seriale', 2], ['archiwum', 5], ['nowości', 3], ['lista życzeń', 4]];
  const AKTYWNA_ZAKLADKA = 'lista życzeń';
  const LICZBA_KLATEK = 6;
  const NA_STRONE = 25;

  let wszystkieRekordy = [];   // tabela Seriale (do wskaźników dysków i sprawdzania duplikatów)
  let dyskiDane = [];
  let strona = 1;
  let naglowekWczytany = false;
  let serialeMaPlakatTmdb = false;   // czy tabela Seriale ma już kolumnę plakat_tmdb
  let serialeMaTvmazeId = false;     // czy tabela Seriale ma już kolumnę tvmaze_id
  let serialeMaPlakatUrl = false;    // czy tabela Seriale ma już kolumnę plakat_url

  function pad2(n){ return String(n).padStart(2, '0'); }

  let komunikatTimer = null;
  function pokazKomunikat(tekst, etykieta, funkcja){
    const el = document.getElementById('komunikat');

  function znajdzWSerialach(tytul, rok){
    const f = doFormatuBazy(tytul);

  function polaKarty(r){
    // Pola przenoszone do tabeli Seriale; plakat tylko jeśli istnieje.
    const pola = { tytul: r.tytul, link_epguides: r.link_epguides || '', kraj: r.kraj || '', opis: r.opis || '' };

  function escapeHtml(tekst){
    const div = document.createElement('div');
    div.textContent = tekst == null ? '' : String(tekst);
    return div.innerHTML;
  }

  function pokazBlad(tresc){
    document.getElementById('blad').innerHTML = '<div class="error">' + escapeHtml(tresc) + '</div>';
  }

  function inicjalTytulu(tytul){
    return (tytul || '?').trim().charAt(0).toUpperCase();
  }

  // ---- Plakaty: ładowane wprost z serwerów TMDb (ścieżka zapisana w kolumnie plakat_tmdb).
  // Nie zużywa to limitu wywołań API Grista.
  function plakatHtml(r){
    const litera = escapeHtml(inicjalTytulu(r.tytul));
    const adresTv = (r.plakat_url || '').trim();
    const sciezka = (r.plakat_tmdb || '').trim();
    let adres = '';
    if(/^https:\/\/static\.tvmaze\.com\/uploads\/images\/[A-Za-z0-9_\-\/.]+$/.test(adresTv)) adres = adresTv;
    else if(/^\/[A-Za-z0-9_\-.]+$/.test(sciezka)) adres = 'https://image.tmdb.org/t/p/w185' + sciezka;
    if(adres){
      return '<div class="poster"><span>' + litera + '</span><img src="' + adres +
             '" alt="" loading="lazy" onerror="this.remove()"></div>';
    }
    return '<div class="poster"><span>' + litera + '</span></div>';
  }

  // Liczba różnych sezonów w zapisie historii ("[✓] S01: 24 odc." itd.).
  function liczbaSezonow(historia){
    if(!historia) return 0;
    const numery = new Set();
    const re = /S(\d{1,3}):/g;
    let m;
    while((m = re.exec(historia)) !== null) numery.add(Number(m[1]));
    return numery.size;
  }

  function odmianaSezonow(n){
    if(n === 1) return '1 sezon';
    const d = n % 10, dd = n % 100;
    if(d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) return n + ' sezony';
    return n + ' sezonów';
  }

  // ---- Ręczne dodawanie ("+"): krótki formularz nad listą ----
  function doFormatuBazy(tytul){
    // "The Wire" -> "Wire, The"; rok w nawiasie na końcu wycinamy do osobnego pola
    let t = (tytul || '').trim();
    let rok = null;
    const m = /^(.*?)\s*\((\d{4})\)\s*$/.exec(t);
    if(m && m[1].trim()){ t = m[1].trim(); rok = Number(m[2]); }
    const a = /^(The|A|An)\s+(.+)$/i.exec(t);
    if(a){
      const art = a[1].charAt(0).toUpperCase() + a[1].slice(1).toLowerCase();
      t = a[2].trim() + ', ' + art;
    }
    return { tytul: t, rokZNazwy: rok };
  }

  function przelaczPanel(pokaz){
    const p = document.getElementById('dodaj-panel');
    if(!p) return;
    p.style.display = pokaz ? 'grid' : 'none';

  // Tytuł jako link do strony serialu na epguides (jeśli jest link).
  function tytulHtml(r){

  function fmtGb(gb){
    gb = Number(gb) || 0;
    return gb >= 1000 ? (gb / 1000).toFixed(1).replace('.', ',') + ' TB' : Math.round(gb) + ' GB';
  }

  let liczbaNowosci = 0;   // ile pozycji czeka w tabeli Nowosci (kropka przy zakładce)
  let nowosciTvIds = new Set();   // numery TVmaze pozycji z Nowości

  function renderujNav(){

  function renderujDyski(){
    const nazwy = ['dysk_0', 'dysk_1', 'dysk_2'];
    const html = nazwy.map((nazwa, indeks) => {
      const wiersz = dyskiDane.find(d => d.dysk === nazwa) || {};
      const pojemnosc = Number(wiersz.pojemnosc_gb) || 0;
      const wolne = Number(wiersz.wolne_gb) || 0;
      const wSerialach = wszystkieRekordy
        .filter(r => r.dysk === nazwa)
        .reduce((suma, r) => suma + (Number(r.rozmiar_gb) || 0), 0);

      let procent = null, opis;
      if(pojemnosc > 0){
        procent = Math.max(0, Math.min(100, Math.round((pojemnosc - wolne) / pojemnosc * 100)));
        opis = fmtGb(pojemnosc - wolne) + ' / ' + fmtGb(pojemnosc) + ' · ' + fmtGb(wolne) + ' wolne';
      } else {
        opis = 'brak danych o pojemności · seriale: ' + fmtGb(wSerialach);
      }
      const wypelnione = procent === null ? 0 : Math.round(procent / 100 * LICZBA_KLATEK);
      let klatki = '';
      for(let i = 0; i < LICZBA_KLATEK; i++){
        klatki += '<div class="filmstrip-frame' + (i < wypelnione ? ' filled dysk' + indeks : '') + '"></div>';
      }
      return '<div class="disk-gauge">' +
        '<div class="disk-gauge-label">' + nazwa + ' <span>' + (procent === null ? '—' : procent + '%') + '</span></div>' +
        '<div class="filmstrip">' + klatki + '</div>' +
        '<div class="disk-gauge-detail">' + escapeHtml(opis) + '</div>' +
      '</div>';
    }).join('');
    document.getElementById('dyski').innerHTML = html;

  async function wczytajDyski(){

  function renderujPager(liczbaStron){
    const html = liczbaStron <= 1 ? '' :
      '<button data-akcja="wstecz" aria-label="poprzednia strona"' + (strona <= 1 ? ' disabled' : '') + '>‹</button>' +
      '<span class="info">' + strona + ' / ' + liczbaStron + '</span>' +
      '<button data-akcja="dalej" aria-label="następna strona"' + (strona >= liczbaStron ? ' disabled' : '') + '>›</button>';
    document.getElementById('pager-gora').innerHTML = html;
    document.getElementById('pager-dol').innerHTML = html;
    // widoki bez filtrów statusu: górny wiersz pokazujemy tylko wtedy, gdy są strzałki
    const wiersz = document.getElementById('filtry');
    if(wiersz && !document.getElementById('chips')) wiersz.style.display = html ? 'flex' : 'none';

  let zyczenia = [];
  let zyczeniaMaPlakatUrl = false;   // czy ListaZyczen ma już kolumnę plakat_url
  let zyczeniaMaTvmazeId = false;    // czy ListaZyczen ma już kolumnę tvmaze_id
  let odrzuconeTvIds = new Set();    // numery TVmaze seriali odrzuconych albo pominiętych (tabela Odrzucone)
  let wybranySezon = {};       // id rekordu -> numer wybranego sezonu
  let oczekujeArchiwum = null; // id rekordu, który czeka na potwierdzenie przeniesienia

  // "[✓] S01: 24 odc." -> [{nr:1, razem:24}, ...]; "??" oznacza nieznaną liczbę odcinków (razem = 0)
  function parsujSezony(historia){
    const mapa = new Map();
    (historia || '').split('\n').forEach(linia => {
      const m = /S(\d{1,3}):\s*(\d+|\?\?)\s*odc/.exec(linia);
      if(!m) return;
      const nr = Number(m[1]);
      const razem = m[2] === '??' ? 0 : Number(m[2]);
      if(!mapa.has(nr) || (mapa.get(nr) === 0 && razem > 0)) mapa.set(nr, razem);
    });
    return Array.from(mapa.entries()).sort((a, b) => a[0] - b[0]).map(p => ({ nr: p[0], razem: p[1] }));
  }

  // "[~] S01: 03/43 odc. {01-03,05}" -> Map(nr -> Set(numerów odcinków))
  function parsujPosiadane(tekst){
    const wynik = new Map();
    (tekst || '').split('\n').forEach(linia => {
      const m = /S(\d{1,3}):\s*(\d+)\s*\/\s*(\d+|\?\?)/.exec(linia);
      if(!m) return;
      const nr = Number(m[1]);
      const n = Number(m[2]);
      const zbior = new Set();
      const b = /\{([^}]*)\}/.exec(linia);
      if(b){
        b[1].split(',').forEach(cz => {
          const p = cz.trim();
          if(!p) return;
          const r = /^(\d+)\s*-\s*(\d+)$/.exec(p);
          if(r){ for(let e = Number(r[1]); e <= Number(r[2]) && e < 10000; e++) zbior.add(e); }
          else if(/^\d+$/.test(p)) zbior.add(Number(p));
        });
      } else if(n > 0){
        for(let e = 1; e <= n; e++) zbior.add(e);
      }
      wynik.set(nr, zbior);
    });
    return wynik;
  }

  function zakresy(zbior){
    const a = Array.from(zbior).sort((x, y) => x - y);
    const out = [];
    let s = null, p = null;
    const zamknij = () => { out.push(s === p ? pad2(s) : pad2(s) + '-' + pad2(p)); };
    a.forEach(e => {
      if(s === null){ s = p = e; }
      else if(e === p + 1){ p = e; }
      else { zamknij(); s = p = e; }
    });
    if(s !== null) zamknij();
    return out.join(',');
  }

  function zapiszLinie(sezony, posiadane){
    return sezony.map(s => {
      const zbior = posiadane.get(s.nr) || new Set();
      const trzymane = Array.from(zbior).filter(e => s.razem === 0 || e <= s.razem);
      const n = trzymane.length;
      const sym = n === 0 ? '[ ]' : (s.razem > 0 && n >= s.razem ? '[◇]' : '[~]');
      const baza = sym + ' S' + pad2(s.nr) + ': ' + pad2(n) + '/' + (s.razem ? pad2(s.razem) : '??') + ' odc.';
      return n > 0 ? baza + ' {' + zakresy(new Set(trzymane)) + '}' : baza;
    }).join('\n');
  }

  function policzSezon(s, posiadane){
    const zbior = posiadane.get(s.nr) || new Set();
    return Array.from(zbior).filter(e => e >= 1 && (s.razem === 0 || e <= s.razem)).length;
  }

  function czyKompletne(sezony, posiadane){
    return sezony.length > 0 && sezony.every(s => s.razem > 0 && policzSezon(s, posiadane) >= s.razem);
  }

  function domyslnySezon(sezony, posiadane){
    const niepelny = sezony.find(s => s.razem > 0 && policzSezon(s, posiadane) < s.razem);
    if(niepelny) return niepelny.nr;
    const znany = sezony.find(s => s.razem > 0);
    return znany ? znany.nr : (sezony[0] ? sezony[0].nr : null);
  }

  function renderuj(){
    const fraza = document.getElementById('szukaj').value.trim().toLowerCase();
    const lista = document.getElementById('lista');
    const pusto = document.getElementById('pusto');
    lista.innerHTML = '';

    const pasujace = zyczenia
      .filter(r => !fraza || (r.tytul || '').toLowerCase().includes(fraza))
      .sort((a, b) => doFormatuBazy(a.tytul).tytul.localeCompare(doFormatuBazy(b.tytul).tytul, 'pl'));

    const liczbaStron = Math.max(1, Math.ceil(pasujace.length / NA_STRONE));
    if(strona > liczbaStron) strona = liczbaStron;
    if(strona < 1) strona = 1;
    const start = (strona - 1) * NA_STRONE;
    const naStronie = pasujace.slice(start, start + NA_STRONE);

    document.getElementById('licznik').textContent = pasujace.length === 0
      ? '0 pozycji'
      : (start + 1) + '–' + (start + naStronie.length) + ' z ' + pasujace.length;
    renderujPager(liczbaStron);

    if(pasujace.length === 0){ pusto.style.display = 'block'; return; }
    pusto.style.display = 'none';

    naStronie.forEach(r => {
      const sezony = parsujSezony(r.historia_sezonow);
      const posiadane = parsujPosiadane(r.odcinki_posiadane);
      let wybrany = wybranySezon[r.id];
      if(!sezony.some(s => s.nr === wybrany)) wybrany = domyslnySezon(sezony, posiadane);

      let razemOdc = 0, mamOdc = 0;
      sezony.forEach(s => { razemOdc += s.razem; mamOdc += policzSezon(s, posiadane); });
      const kompletne = czyKompletne(sezony, posiadane);

      // tytuł pokazujemy w formacie bazy ("Wire, The"), rok z nawiasu trafia do opisu
      const fTytul = doFormatuBazy(r.tytul);
      const wyswietlany = Object.assign({}, r, { tytul: fTytul.tytul });
      const metaCzesci = [r.rok || fTytul.rokZNazwy, r.kraj].filter(Boolean);
      if(sezony.length > 0) metaCzesci.push(odmianaSezonow(sezony.length));

      let dol = '';
      if(sezony.length === 0){
        dol = '<div class="brak-sezonow">brak informacji o sezonach</div>';
      } else {
        const chipy = sezony.map(s => {
          const mam = policzSezon(s, posiadane);
          let klasa = 'season-chip';
          if(s.razem === 0) klasa += ' nieznany';
          else if(mam >= s.razem) klasa += ' done';
          else if(mam > 0) klasa += ' partial';
          if(s.nr === wybrany) klasa += ' selected';
          return '<button class="' + klasa + '" data-akcja="sezon" data-id="' + r.id + '" data-nr="' + s.nr + '">S' + pad2(s.nr) + '</button>';
        }).join('');

        const sel = sezony.find(s => s.nr === wybrany);
        let siatka = '';
        if(sel && sel.razem > 0){
          const zbior = posiadane.get(sel.nr) || new Set();
          let piksele = '';
          for(let e = 1; e <= sel.razem; e++){
            piksele += '<button class="ep-pixel' + (zbior.has(e) ? ' done' : '') + '" data-akcja="odc" data-id="' + r.id +
              '" data-nr="' + sel.nr + '" data-odc="' + e + '" title="S' + pad2(sel.nr) + 'E' + pad2(e) + '">' + pad2(e) + '</button>';
          }
          siatka =
            '<div class="ep-progress"><span>S' + pad2(sel.nr) + ' — ' + policzSezon(sel, posiadane) + ' / ' + sel.razem + ' odcinków</span>' +
              '<button class="mini-btn" data-akcja="caly" data-id="' + r.id + '" data-nr="' + sel.nr + '">cały sezon</button>' +
              '<button class="mini-btn" data-akcja="wyczysc" data-id="' + r.id + '" data-nr="' + sel.nr + '">wyczyść</button>' +
            '</div><div class="ep-grid">' + piksele + '</div>';
        } else if(sel){
          siatka = '<div class="brak-sezonow">nieznana liczba odcinków w sezonie S' + pad2(sel.nr) + '</div>';
        }
        dol = '<div class="season-row">' + chipy + '</div>' + siatka;
      }

      const potwierdza = oczekujeArchiwum === r.id;
      const el = document.createElement('div');
      el.className = 'zyczenie';
      el.innerHTML =
        '<div class="zyczenie-top">' +
          plakatHtml(wyswietlany) +
          '<div class="card-main">' +
            '<h3>' + tytulHtml(wyswietlany) + '</h3>' +
            '<div class="meta">' + escapeHtml(metaCzesci.join(' · ')) + '</div>' +
            '<p class="desc">' + escapeHtml(r.opis || '') + '</p>' +
          '</div>' +
          '<div class="card-side">' +
            (razemOdc > 0 ? '<div class="suma">razem ' + mamOdc + ' / ' + razemOdc + ' odc.</div>' : '') +
            (kompletne
              ? '<button class="add-btn' + (potwierdza ? ' confirm' : '') + '" data-akcja="archiwum" data-id="' + r.id + '">' +
                  (potwierdza ? 'na pewno?' : 'przenieś do archiwum') + '</button>'
              : '') +
          '</div>' +
        '</div>' + dol;
      lista.appendChild(el);
    });
  }

  async function zapiszPosiadane(rekord, posiadane){

  async function doArchiwum(id){
    const r = zyczenia.find(x => x.id === id);
    if(!r) return;
    const pola = polaKarty(r);
    const fTytul = doFormatuBazy(r.tytul);
    pola.tytul = fTytul.tytul;
    if(!pola.rok && fTytul.rokZNazwy) pola.rok = fTytul.rokZNazwy;
    pola.status = 'kompletny';
    pola.historia_sezonow = r.historia_sezonow || '';
    const istniejacy = znajdzWSerialach(r.tytul, r.rok);
    const akcje = [];
    if(istniejacy){
      const zmiany = { status: 'kompletny' };
      if(pola.historia_sezonow) zmiany.historia_sezonow = pola.historia_sezonow;
      if(pola.plakat_tmdb) zmiany.plakat_tmdb = pola.plakat_tmdb;
      akcje.push(['UpdateRecord', 'Seriale', istniejacy.id, zmiany]);
    } else {
      akcje.push(['AddRecord', 'Seriale', null, pola]);
    }
    akcje.push(['RemoveRecord', 'ListaZyczen', id]);
    try{
      await grist.docApi.applyUserActions(akcje);
      zyczenia = zyczenia.filter(x => x.id !== id);
      oczekujeArchiwum = null;
      pokazKomunikat('przeniesiono „' + r.tytul + '” do archiwum');
      renderuj();
    } catch(e){
      pokazBlad('nie udało się przenieść do archiwum: ' + e.message);
    }
  }

  async function wczytajDane(){
    try{
      const t = await grist.docApi.fetchTable('ListaZyczen');
      zyczenia = [];
      for(let i = 0; i < t.id.length; i++){
        zyczenia.push({

      } catch(e){ odrzuconeTvIds = new Set(); }
      await wczytajNaglowek();

  document.addEventListener('click', (ev) => {

      if(akcja === 'wstecz' || akcja === 'dalej'){

      }

        else { oczekujeArchiwum = id; renderuj(); }
      }
      else if(rekord && akcja === 'sezon'){

          if(zbior.has(e)) zbior.delete(e); else zbior.add(e);

  document.getElementById('szukaj').addEventListener('input', () => { strona = 1; renderuj(); });

  // ================== Przeglądaj / szukaj (TVmaze) ==================
  const TVMAZE = 'https://api.tvmaze.com';
  let widok = 'lista';
  let tvTryb = 'partie';           // 'partie' (kolejne porcje z indeksu TVmaze) albo 'szukaj'
  let tvStrona = 0, tvIdx = 0, tvDane = null, tvKoniec = false;   // pozycja w indeksie TVmaze (wg numeru dodania)
  let tvPozycje = [];              // to, co widać na liście
  let tvPominiete = new Set();
  let tvDodane = new Set();
  let tvPozycjaWczytana = false;
  let tvEdycjaId = null;           // pozycja, której tytuł poprawiasz przed dodaniem

  function tvRok(s){ return s.premiered ? Number(String(s.premiered).slice(0, 4)) : null; }
  function tvKodKraju(n){
    const k = n && n.country && n.country.code;
    return k === 'GB' ? 'UK' : (k || '');
  }
  function tvKraj(s){ return tvKodKraju(s.network) || tvKodKraju(s.webChannel); }
  function tvStacja(s){
    const n = s.network || s.webChannel;
    if(!n) return '';
    const k = tvKodKraju(n);
    return n.name + (k ? ' (' + k + ')' : '');
  }
  function tvOpis(s){
    return (new DOMParser().parseFromString(s.summary || '', 'text/html').body.textContent || '').trim();
  }
  function tvFiltrFabularne(){
    const c = document.getElementById('tylko-fabularne');
    return !c || c.checked;
  }
  function tvPasuje(s){
    if(!s || !s.premiered) return false;
    if(tvFiltrFabularne()) return s.language === 'English' && (s.type === 'Scripted' || s.type === 'Animation');
    return true;
  }

  // Nazwa bez wielkości liter, rodzajnika i znaków specjalnych (do porównań)
  function normNazwy(t){
    let s = doFormatuBazy(t).tytul.toLowerCase().replace(/,\s*(the|a|an)$/, '');
    return s.replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '');
  }
  let indeksNazw = null;
  function zbudujIndeksNazw(){
    indeksNazw = [];
    wszystkieRekordy.forEach(x => indeksNazw.push({ n: normNazwy(x.tytul), rok: Number(x.rok) || null, kraj: (x.kraj || '').toUpperCase(), gdzie: 'baza' }));
    zyczenia.forEach(x => indeksNazw.push({ n: normNazwy(x.tytul), rok: Number(x.rok || doFormatuBazy(x.tytul).rokZNazwy) || null, kraj: (x.kraj || '').toUpperCase(), gdzie: 'lista' }));
  }

  // Gdzie już jest ten serial? 'odrzucone' | 'baza' | 'lista' | 'nowosci' | '' (nigdzie).
  // Najpierw po numerze TVmaze (pewne), potem po nazwie (dla wierszy bez numeru): identyczna nazwa
  // albo nazwa z przedrostkiem uniwersum ("Star Wars: Andor" = "Andor"), z zgodnym rokiem premiery.
  function tvGdzie(s){
    const id = s.id;
    if(odrzuconeTvIds.has(id)) return 'odrzucone';
    if(wszystkieRekordy.some(x => Number(x.tvmaze_id) === id)) return 'baza';
    if(zyczenia.some(x => Number(x.tvmaze_id) === id)) return 'lista';
    if(nowosciTvIds.has(id)) return 'nowosci';
    if(!indeksNazw) zbudujIndeksNazw();
    const tn = normNazwy(s.name);
    const rok = tvRok(s);
    const kraj = tvKraj(s);
    for(const e of indeksNazw){
      if(rok && e.rok && Math.abs(e.rok - rok) > 1) continue;
      if(e.n === tn) return e.gdzie;
      if(rok && e.rok && tn.length >= 5 && e.n.endsWith(tn)) return e.gdzie;
      if(rok && e.rok && e.n.length >= 5 && tn.endsWith(e.n)) return e.gdzie;
      // Nazwy mogą się różnić (Twój tytuł kontra nazwa w TVmaze, np. "CSI: Las Vegas" / "CSI: Crime Scene
      // Investigation") - przy zgodnym roku, kraju i wspólnym początku nazwy to prawie na pewno ten sam serial.
      if(rok && e.rok === rok && kraj && e.kraj && kraj === e.kraj && tn.length >= 3 && e.n.length >= 3 &&
         (tn.slice(0, 3) === e.n.slice(0, 3))) return e.gdzie;
    }
    return '';
  }

  async function tvPobierz(sciezka){
    for(let proba = 0; proba < 3; proba++){
      const r = await fetch(TVMAZE + sciezka);
      if(r.status === 429){ await new Promise(res => setTimeout(res, 3000)); continue; }
      if(!r.ok) return null;
      return await r.json();
    }
    return null;
  }

  async function wczytajPozycjeTv(){
    if(tvPozycjaWczytana) return;
    tvPozycjaWczytana = true;
    try{
      const o = await grist.widgetApi.getOption('tv');
      if(o && Number.isInteger(o.strona)){ tvStrona = o.strona; tvIdx = Number(o.idx) || 0; }
    } catch(e){ /* brak zapisanej pozycji - zaczynamy od początku */ }
  }
  async function zapiszPozycjeTv(){
    try{ await grist.widgetApi.setOption('tv', { strona: tvStrona, idx: tvDane ? tvIdx : 0 }); } catch(e){ /* pozycja nie zapisze się */ }
  }

  // Kolejne 20 pozycji z indeksu TVmaze: pomija to, co już masz albo masz na liście życzeń
  async function tvPartia(){
    const nowe = [];
    while(nowe.length < 20 && !tvKoniec){
      if(!tvDane){
        const d = await tvPobierz('/shows?page=' + tvStrona);
        if(!d || !d.length){ tvKoniec = true; break; }
        tvDane = d;
      }
      while(tvIdx < tvDane.length && nowe.length < 20){
        const s = tvDane[tvIdx++];
        if(tvPasuje(s) && !tvGdzie(s)) nowe.push(s);
      }
      if(tvIdx >= tvDane.length){ tvStrona++; tvDane = null; tvIdx = 0; }
    }
    return nowe;
  }

  function tvStan(tekst){ document.getElementById('stan-tv').textContent = tekst || ''; }

  async function zaladujPartie(){
    tvStan('pobieram z TVmaze…');
    try{
      await wczytajPozycjeTv();
      tvTryb = 'partie';
      tvPozycje = await tvPartia();
      await zapiszPozycjeTv();
      tvStan(tvPozycje.length === 0 && tvKoniec ? 'to już koniec listy TVmaze' : '');
    } catch(e){
      tvStan('nie udało się pobrać danych z TVmaze: ' + e.message);
    }
    renderujTv();
  }

  async function szukajTv(fraza){
    tvStan('szukam w TVmaze…');
    try{
      const wynik = await tvPobierz('/search/shows?q=' + encodeURIComponent(fraza));
      tvTryb = 'szukaj';
      tvPozycje = (wynik || []).map(w => w.show).filter(Boolean);
      tvStan(tvPozycje.length === 0 ? 'nic nie znaleziono' : '');
    } catch(e){
      tvStan('nie udało się wyszukać w TVmaze: ' + e.message);
    }
    renderujTv();
  }

  function renderujTv(){
    const lista = document.getElementById('lista-tv');
    const przycisk = document.getElementById('nastepna-partia');
    przycisk.textContent = tvTryb === 'szukaj' ? 'wróć do przeglądania' : 'pobierz kolejną partię (20)';
    przycisk.disabled = tvTryb === 'partie' && tvKoniec;
    lista.innerHTML = tvPozycje.filter(s => !tvPominiete.has(s.id)).map(s => {
      const gdzie = tvDodane.has(s.id) ? 'dodano' : tvGdzie(s);
      const opis = tvOpis(s);
      const skrot = opis.length > 190 ? opis.slice(0, 187) + '…' : opis;
      const meta = [tvStacja(s), (s.genres || []).join(' / '), (s.type && s.type !== 'Scripted') ? s.type : ''].filter(Boolean).join(' · ');
      const przyciski = gdzie === 'dodano' ? '<span class="info-tag">✓ dodano</span>'
        : gdzie === 'lista' ? '<span class="info-tag">na liście</span>'
        : gdzie === 'baza' ? '<span class="info-tag">w bazie</span>'
        : gdzie === 'nowosci' ? '<span class="info-tag">w nowościach</span>'
        : gdzie === 'odrzucone' ? '<span class="info-tag">odrzucone</span>'
        : (tvEdycjaId === s.id
            ? '<input class="tytul-edycja" id="edycja-tytul-tv" value="' + escapeHtml(doFormatuBazy(s.name).tytul) + '" aria-label="tytuł na liście">' +
              '<button class="add-btn" data-tv="potwierdz" data-id="' + s.id + '">dodaj</button>' +
              '<button class="reject-btn" data-tv="anuluj" data-id="' + s.id + '">anuluj</button>'
            : '<button class="reject-btn" data-tv="pomin" data-id="' + s.id + '">pomiń</button>' +
              '<button class="add-btn" data-tv="dodaj" data-id="' + s.id + '">+ do listy życzeń</button>');
      return '<div class="list-item">' +
        '<div class="list-date">' + escapeHtml(tvRok(s) || '') + '</div>' +
        '<div class="list-main"><h4><a href="' + escapeHtml(s.url || '#') + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a></h4>' +
          '<div class="meta">' + escapeHtml(meta) + '</div>' +
          (skrot ? '<p class="desc">' + escapeHtml(skrot) + '</p>' : '') + '</div>' +
        '<div class="btn-row">' + przyciski + '</div></div>';
    }).join('');
    const pole = document.getElementById('edycja-tytul-tv');
    if(pole){ pole.focus(); pole.select(); }
  }

  async function pominTv(id){
    const s = tvPozycje.find(x => x.id === id);
    tvPominiete.add(id);
    renderujTv();
    if(!s || !s.url) return;
    try{
      await grist.docApi.applyUserActions([['AddRecord', 'Odrzucone', null, { link: s.url }]]);
    } catch(e){
      try{     // tabeli Odrzucone jeszcze nie ma - zakładamy ją
        await grist.docApi.applyUserActions([
          ['AddTable', 'Odrzucone', [{ id: 'link', type: 'Text' }]],
          ['AddRecord', 'Odrzucone', null, { link: s.url }],
        ]);
      } catch(e2){ return; }
    }
    odrzuconeTvIds.add(id);
  }

  async function dodajZTv(id, tytulReczny){
    const s = tvPozycje.find(x => x.id === id);
    if(!s) return;
    const f = doFormatuBazy((tytulReczny || '').trim() || s.name);
    const pola = { tytul: f.tytul, link_epguides: s.url || '' };
    const rok = tvRok(s);
    if(rok) pola.rok = rok;
    const kraj = tvKraj(s);
    if(kraj) pola.kraj = kraj;
    const opis = tvOpis(s);
    if(opis) pola.opis = opis;
    try{
      // liczba odcinków w każdym sezonie -> od razu działa siatka odcinków na liście życzeń
      const ep = await tvPobierz('/shows/' + id + '/episodes');
      if(ep && ep.length){
        const licz = {};
        ep.forEach(e => { if(e.season != null && e.number != null) licz[e.season] = (licz[e.season] || 0) + 1; });
        pola.historia_sezonow = Object.keys(licz).map(Number).sort((a, b) => a - b)
          .map(nr => '[✓] S' + pad2(nr) + ': ' + pad2(licz[nr]) + ' odc.').join('\n');
      }
    } catch(e){ /* listę sezonów można uzupełnić później */ }
    try{
      // plakat z TVmaze: przy pierwszym dodaniu zakładamy kolumnę plakat_url w Liście życzeń
      const obraz = (s.image && s.image.medium) || '';
      const akcje = [];
      if(!zyczeniaMaTvmazeId) akcje.push(['AddColumn', 'ListaZyczen', 'tvmaze_id', { type: 'Int', label: 'tvmaze id' }]);
      pola.tvmaze_id = id;
      if(obraz){
        if(!zyczeniaMaPlakatUrl) akcje.push(['AddColumn', 'ListaZyczen', 'plakat_url', { type: 'Text', label: 'plakat URL' }]);
        pola.plakat_url = obraz;
      }
      akcje.push(['AddRecord', 'ListaZyczen', null, pola]);
      try{
        await grist.docApi.applyUserActions(akcje);
        zyczeniaMaTvmazeId = true;
        if(obraz) zyczeniaMaPlakatUrl = true;
      } catch(e){
        if(!obraz) throw e;
        delete pola.plakat_url;          // bez plakatu też się uda
        if(!zyczeniaMaTvmazeId) delete pola.tvmaze_id;
        await grist.docApi.applyUserActions([['AddRecord', 'ListaZyczen', null, pola]]);
      }
      tvDodane.add(id);
      tvEdycjaId = null;
      await wczytajDane();
      renderujTv();
      pokazKomunikat('dodano „' + f.tytul + '” do listy życzeń');
    } catch(e){
      pokazBlad('nie udało się dodać: ' + e.message);
    }
  }

  async function przelaczWidok(nowy){
    widok = nowy;
    document.getElementById('widok-lista').style.display = nowy === 'lista' ? 'block' : 'none';
    document.getElementById('widok-przegladaj').style.display = nowy === 'przegladaj' ? 'block' : 'none';
    document.querySelectorAll('.subtabs button[data-widok]').forEach(b => b.classList.toggle('active', b.dataset.widok === nowy));
    if(nowy === 'przegladaj' && tvPozycje.length === 0 && tvTryb === 'partie') await zaladujPartie();
  }

    if(b.dataset.tv === 'pomin'){ pominTv(id); }
    else if(b.dataset.tv === 'dodaj'){ tvEdycjaId = id; renderujTv(); }
    else if(b.dataset.tv === 'anuluj'){ tvEdycjaId = null; renderujTv(); }
    else if(b.dataset.tv === 'potwierdz'){ const p = document.getElementById('edycja-tytul-tv'); b.disabled = true; dodajZTv(id, p ? p.value : ''); }
  });

  renderujNav();
  renderujDyski();
  podepnijPanelDodawania(dodajRecznie);
  grist.ready({ requiredAccess: 'full' });
  grist.onRecords(wczytajDane);
  wczytajDane();
</script>
